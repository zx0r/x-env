#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[mgr]
ratio = [1, 2, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 8
mouse_events = ["click", "scroll"]
title_format = "{cwd} 󰇘 X"

[preview]
wrap = "yes"
tab_size = 2
max_width = 3840
max_height = 2400
image_delay = 10
image_filter = "lanczos3"
image_quality = 90
sixel_fraction = 10

# ==============================================================================
# OPENER MATRIX (macOS / Neovim / Lazygit)
# ==============================================================================
[opener]
edit = [{ run = 'nvim %s', block = true, desc = "Neovim" }]
system_open = [{ run = 'open %s', orphan = true, desc = "macOS Open" }]
reveal = [{ run = 'open -R %s1', orphan = true, desc = "Reveal in Finder" }]
lazygit = [{ run = 'lazygit', block = true, desc = "Lazygit" }]
codium = [{ run = 'codium %s', orphan = true, desc = "VSCodium" }]
kitty_edit = [
  { run = 'kitty --detach nvim %s', orphan = true, desc = "Neovim (Kitty Window)" },
]
ghostty_edit = [
  { run = 'open -na Ghostty.app --args -e nvim %s', orphan = true, desc = "Neovim (Ghostty Window)" },
]
archive = [
  { run = 'ouch d -y %s', block = true, desc = "Extract with ouch" },
  { run = '7z x %s1', block = true, desc = "Extract with 7z" },
]

# ==============================================================================
# OPEN RULES
# ==============================================================================
[open]
rules = [
  # Directories
  { url = "*/", use = [
    "edit",
    "system_open",
    "reveal",
  ] },

  # Empty Inode (Newly touched files) -> Neovim
  { mime = "inode/x-empty", use = [
    "edit",
    "codium",
  ] },

  # Text & Source Code -> Neovim / Codium / Ghostty / Kitty
  { mime = "text/*", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
    "reveal",
  ] },
  { mime = "application/json", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
  ] },
  { mime = "application/javascript", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
  ] },
  { mime = "application/toml", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
  ] },
  { mime = "application/x-yaml", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
  ] },

  # Media Files -> System Open
  { mime = "image/*", use = [
    "system_open",
    "reveal",
  ] },
  { mime = "video/*", use = [
    "system_open",
    "reveal",
  ] },
  { mime = "audio/*", use = [
    "system_open",
    "reveal",
  ] },
  { mime = "application/pdf", use = [
    "system_open",
    "reveal",
  ] },

  # E-Books & Documents -> macOS Books / Preview
  { mime = "application/epub+zip", use = [
    "system_open",
    "reveal",
  ] },
  { mime = "application/x-mobipocket-ebook", use = [
    "system_open",
    "reveal",
  ] },

  # Archives
  { mime = "application/*zip", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/x-tar", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/x-7z-compressed", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/x-rar", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/gzip", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/x-bzip*", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/x-xz", use = [
    "archive",
    "system_open",
  ] },
  { mime = "application/zstd", use = [
    "archive",
    "system_open",
  ] },

  # Fallback -> Neovim
  { url = "*", use = [
    "edit",
    "codium",
    "ghostty_edit",
    "kitty_edit",
    "system_open",
    "reveal",
  ] },
]

# ==============================================================================
# PLUGIN PIPELINES (Fetchers & Previewers)
# ==============================================================================
# Architecture: Cascading precedence — most specific first.
#
# Preview Rendering Strategy (Zero Overhead — all cache-hit paths = 0 subprocesses):
#   Tier 1: .mmd / .mermaid → mermaid.yazi (mmdc → PNG → ya.image_show)
#   Tier 2: .md / .markdown → markdown.yazi (glow ANSI cache, auto-delegates to
#           mermaid.yazi when ```mermaid blocks detected)
#   Tier 3: .tex            → latex.yazi (tectonic → PDF → pdftoppm → PNG)
#   Tier 4: .bib/.sty/.cls  → bat.yazi (syntax highlighting, no compilation)
#   Tier 5: Code / text/*   → bat.yazi (syntax highlighting via bat --theme=x)
# ==============================================================================
[plugin]
prepend_fetchers = [
  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
  { group = "mactag", url = "*", run = "mactag" },
  { group = "mactag", url = "*/", run = "mactag" },
]

prepend_preloaders = [
  # ── Preload Tier 1: `ii` IPC Socket Coprocessor (Markdown, Math, Diagrams, Notebooks, Quarto) ──
  { url = "*.{md,markdown,mdx,qmd,rmd,ipynb,mmd,mermaid,dot,gv,svg,svgz,tex,latex,typ,typst,chem,mhchem,html,htm,csv,tsv,vl,vega,vega-lite,plotly,zip,jar,whl,tar,tgz,tbz2,txz,tzst}", run = "ii" },
]

prepend_previewers = [
  # ── Tier 0: ii IPC Socket Coprocessor (Markdown, Math, Diagrams, SVG, Notebooks, Quarto) ──
  { url = "*.{md,markdown,mdx,qmd,rmd}", run = "ii" },
  { url = "*.ipynb", run = "ii" },
  { url = "*.{mmd,mermaid,dot,gv,svg,svgz,vl,vega,vega-lite,plotly,chem,mhchem,html,htm}", run = "ii" },
  { url = "*.{csv,tsv}", run = "ii" },
  { url = "*.{tex,latex,typ,typst}", run = "ii" },

  # ── Tier 1: AI / ML Models & Tensors (Zero-RAM Header Inspection) ───────────────
  { url = "*.safetensors", run = 'piper -- python3 -c "import sys,struct,json; f=open(sys.argv[1],\"rb\"); n=struct.unpack(\"<Q\",f.read(8))[0]; h=json.loads(f.read(n)); print(\"=== SafeTensors (%d tensors) ===\" % len(h)); [print(f\"{k:40} {v.get(\x27dtype\x27,\x27\x27):8} {v.get(\x27shape\x27,[])}\") for k,v in list(h.items())[:80] if k!=\"__metadata__\"]" "$1"' },
  { url = "*.gguf", run = 'piper -- python3 -c "import sys,struct; f=open(sys.argv[1],\"rb\"); m=f.read(4); print(\"=== GGUF Model ===\" if m==b\"GGUF\" else \"Invalid GGUF\"); v,tc,kvc=struct.unpack(\"<IQQ\",f.read(20)); print(f\"Version: {v} | Tensors: {tc} | Metadata KV: {kvc}\")" "$1" 2>/dev/null || file "$1"' },
  { url = "*.onnx", run = 'piper -- python3 -c "import sys,onnx; m=onnx.load(sys.argv[1], load_external_data=False); print(f\"=== ONNX Model (IR v{m.ir_version}) ===\"); print(f\"Producer: {m.producer_name} {m.producer_version}\"); print(\"Inputs:\", [i.name for i in m.graph.input[:10]]); print(\"Outputs:\", [o.name for o in m.graph.output[:10]])" "$1" 2>/dev/null || file "$1"' },

  # ── Tier 2: Columnar Data, Datasets & Databases (DuckDB, SQLite) ───────────────
  { url = "*.{parquet,pq,arrow,ipc,feather}", run = 'piper -- duckdb -dark-mode -c "SELECT * FROM \x27$1\x27 LIMIT 50;" 2>/dev/null || bat --color=always --style=plain "$1"' },
  { url = "*.{csv,tsv}", run = 'piper -- duckdb -dark-mode -c "SELECT * FROM read_csv_auto(\x27$1\x27) LIMIT 50;" 2>/dev/null || bat --color=always --style=plain "$1"' },
  { url = "*.{jsonl,ndjson}", run = "piper -- duckdb -dark-mode -c \"SELECT * FROM read_json_auto('$1') LIMIT 40;\" 2>/dev/null || bat --color=always --style=plain \"$1\"" },
  { mime = "application/{sqlite3,x-sqlite3}", run = 'piper -- echo "=== TABLES ===" && sqlite3 "$1" .tables && echo "" && echo "=== SCHEMA ===" && sqlite3 "$1" .schema | head -n 60' },
  { url = "*.{sqlite,sqlite3,db,db3,s3db}", run = 'piper -- echo "=== TABLES ===" && sqlite3 "$1" .tables && echo "" && echo "=== SCHEMA ===" && sqlite3 "$1" .schema | head -n 60' },

  # ── Tier 4: Compiled Binaries, WebAssembly & macOS Mach-O Inspection ────────────
  { url = "*.wasm", run = 'piper -- wasm-objdump -xh "$1" 2>/dev/null | head -n 80 || file "$1"' },
  { url = "*.{dylib,so,a,o}", run = 'piper -- file -b "$1" && echo "" && otool -L "$1" 2>/dev/null && nm -gU "$1" 2>/dev/null | head -n 50' },
  { mime = "application/{x-mach-binary,x-executable,x-sharedlib}", run = 'piper -- file -b "$1" && echo "" && otool -L "$1" 2>/dev/null | head -n 40' },

  # ── Tier 5: Office, Apple iWork & Property Lists ────────────────────────────────
  { url = "*.{docx,doc,rtf,odt}", run = 'piper -- textutil -convert txt -stdout "$1" | head -n 120' },
  { url = "*.{xlsx,xls,ods}", run = 'piper -- duckdb -dark-mode -c "INSTALL spatial; LOAD spatial; SELECT * FROM st_read(\x27$1\x27) LIMIT 50;" 2>/dev/null || xlsx2csv "$1" | head -n 80 | column -s, -t' },
  { url = "*.{pages,numbers,key}", run = 'piper -- mdls "$1" | grep -E "kMDItem(Title|Authors|PageCount|Version|Kind)"' },
  { url = "*.{plist,mobileprovision,entitlements}", run = 'piper -- plutil -p "$1" 2>/dev/null || bat --color=always --style=plain "$1"' },

  # ── Tier 6: Network Captures, Security Certificates & Keys ──────────────────────
  { url = "*.{pcap,pcapng}", run = 'piper -- tcpdump -nn -r "$1" -c 50 2>/dev/null' },
  { url = "*.{pem,crt,cer,der}", run = 'piper -- openssl x509 -in "$1" -text -noout 2>/dev/null | head -n 60 || bat --color=always --style=plain "$1"' },
  { url = "*.pub", run = 'piper -- ssh-keygen -lv -f "$1" 2>/dev/null && echo "" && bat --color=always --style=plain "$1"' },

  # ── Tier 7: Audio & Rich Media Metadata ─────────────────────────────────────────
  { mime = "audio/*", run = 'piper -- mediainfo "$1" 2>/dev/null || afinfo "$1"' },
  { url = "*.{mp3,wav,flac,aac,m4a,ogg,opus,aiff,alac}", run = 'piper -- mediainfo "$1" 2>/dev/null || afinfo "$1"' },

  # ── Tier 8: Web / Rendered HTML ─────────────────────────────────────────────────
  { url = "*.{html,htm,xhtml}", run = 'piper -- w3m -dump "$1" 2>/dev/null | head -n 120 || bat --color=always --style=plain "$1"' },

  # ── Tier 9: Extended & Modern Archives ──────────────────────────────────────────
  { mime = "application/{*zip,tar,x-tar,gzip,x-bzip2,x-xz,zstd,java-archive}", run = "ii" },
  { url = "*.{zip,jar,whl,tar,tgz,tbz2,txz,tzst}", run = "ii" },

  # ── Tier 10: Code, Config & Text → bat ──────────────────────────────────────────
  { mime = "text/*", run = "bat" },
  { mime = "application/{json,javascript,toml,x-yaml,x-sh,x-shellscript,xml}", run = "bat" },
  { url = "*.{lua,rs,go,ts,tsx,js,jsx,py,zig,nim,gleam,odin}", run = "bat" },
  { url = "*.{toml,yaml,yml,json,json5,jsonc,ron,kdl,proto,pbtxt,textproto,hcl,tf}", run = "bat" },
  { url = "*.{sh,bash,zsh,fish,nu}", run = "bat" },
  { url = "*.{env,env.*,conf,ini,cfg,cnf,properties,service,timer,socket,target}", run = "bat" },
  { url = "*.{sql,graphql,gql,prisma}", run = "bat" },
  { url = "*.{astro,svelte,vue,css,scss}", run = "bat" },
  { url = "*.{c,cpp,cc,h,hpp,metal,wgsl,glsl,hlsl}", run = "bat" },
  { url = "*.{bib,sty,cls,log,diff,patch,strings,xcconfig}", run = "bat" },
  { url = "{Justfile,justfile,Procfile,Brewfile,Containerfile,Dockerfile,Earthfile,Fastfile,Makefile}", run = "bat" },
  { url = "*{tmux}*.conf", run = "bat" },
  { url = ".*rc", run = "bat" },
]

append_previewers = [
  # ── Universal Mach-O / Binary Inspection & Hex Dump Fallback ────────────
  { mime = "application/x-mach-binary", run = 'piper -- file "$1" && echo "" && otool -L "$1" 2>/dev/null | head -n 15 && echo "" && hexyl --border=none --terminal-width=$w "$1"' },
  { mime = "application/octet-stream", run = 'piper -- file "$1" && echo "" && hexyl --border=none --terminal-width=$w "$1"' },
  { url = "*", run = 'piper -- file "$1" && echo "" && hexyl --border=none --terminal-width=$w "$1"' },
]

# ==============================================================================
# TASK RUNNER & WORKER POOLS (Apple Silicon M1 Pro: 6 P-Cores Balanced)
# ==============================================================================
[tasks]
file_workers = 4         # APFS instant copy-on-write clone pipeline
plugin_workers = 4       # Max concurrent Lua/CLI plugin tasks
fetch_workers = 4        # Concurrent metadata & git status fetchers
preload_workers = 3      # Headless background pre-cache (prevents CPU spikes)
process_workers = 4      # Heavy external renderers (magick, tectonic, typst)
bizarre_retry = 3
image_alloc = 536870912  # 512 MB memory cache for high-res Retina graphics
image_bound = [0, 0]
suppress_preload = false

# ==============================================================================
# MODAL DIALOGS & PROMPT GEOMETRIES (High-Density UX)
# ==============================================================================
[input]
cursor_blink = false

# Directory jumping & File creation (Clean Top-Center Docking)
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# Contextual Rename (Hovered next to current cursor)
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# Filters & Search prompts
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

overwrite_title = "Overwrite file?"
overwrite_body = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

quit_title = "Quit?"
quit_body = "The following task is still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

# ==============================================================================
# WHICH-KEY POPUP CONFIGURATION
# ==============================================================================
[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false
sort_translit = false
