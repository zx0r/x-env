conds = [
  # ─── Specyal Type и IPC (POSIX Inodes) ───────────────
  { if = "orphan", text = " ", fg = "#FF0000", fg_dark = "#f38ba8", fg_light = "#FF0000" }, # Invalid Symlink (Alert Danger)
  { if = "link", text = " ", fg = "#CD00F7", fg_dark = "#cba6f7", fg_light = "#CD00F7" },   # Valid Symlink (Neon Violet)
  { if = "sticky", text = "󰌾 ", fg = "#FFFF00", fg_dark = "#eed49f", fg_light = "#FFFF00" }, # Sticky-bit (+t, Защищённый узел)
  { if = "sock", text = "󰆧 ", fg = "#94e2d5", fg_dark = "#8bd5ca", fg_light = "#94e2d5" },   # UNIX Domain Socket (IPC)
  { if = "fifo", text = "󰟢 ", fg = "#FF8C00", fg_dark = "#fab387", fg_light = "#FF8C00" },   # Named Pipe (FIFO Stream)
  { if = "block", text = "󰋊 ", fg = "#fab387", fg_dark = "#eed49f", fg_light = "#fab387" },  # Block Device (/dev/nvme, /dev/sd*)
  { if = "char", text = "󰆍 ", fg = "#e3c78a", fg_dark = "#eed49f", fg_light = "#e3c78a" },   # Char Device (/dev/tty*, /dev/null)
  { if = "dummy", text = " ", fg = "#646B84", fg_dark = "#5b6078", fg_light = "#646B84" },  # Ошибочный/недоступный узел VFS

  # ─── Base Fallback-rules ─────────────────────────────────────────
  { if = "dir", text = "󰉋 ", fg = "#00BFC7", fg_dark = "#7dc4e4", fg_light = "#00BFC7" },  # Default directory color (Cyber Cyan)
  { if = "exec", text = " ", fg = "#00FF00", fg_dark = "#a6da95", fg_light = "#00FF00" }, # Exec binary/script (+x)
  { if = "!dir", text = "󰈔 ", fg = "#D4D4D4", fg_dark = "#cdd6f4", fg_light = "#D4D4D4" }, # Default base fale (Clean Slate)
]

