#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
dark = ""
light = ""

[colors]
background = "reset"
foreground = "#D4D4D4"
selection = "#264F78"
cursor = "#AEAFAD"
black = "#000000"
red = "#F44747"
green = "#6A9955"
yellow = "#D7BA7D"
blue = "#569CD6"
magenta = "#C586C0"
cyan = "#4EC9B0"
white = "#D4D4D4"
bright_black = "#808080"
bright_red = "#F44747"
bright_green = "#6A9955"
bright_yellow = "#DCDCAA"
bright_blue = "#569CD6"
bright_magenta = "#C586C0"
bright_cyan = "#4EC9B0"
bright_white = "#FFFFFF"

[app]
overall = { bg = "reset" }

[mgr]
syntect_theme = "~/.config/yazi/themes/x.tmTheme"
cwd = { fg = "#0A84FF", bold = true }
hovered = { fg = "#ff2a6d", bold = true }
preview_hovered = {}
find_keyword = { fg = "#e3c78a", bold = true, italic = true, underline = true }
find_position = { fg = "#ff5189", bold = true, italic = true }
symlink_target = { fg = "#CD00F7", italic = true }
marker_symbol = "▌"
marker_copied = { fg = "#00FF00", bold = true }
marker_cut = { fg = "#FF0000", bold = true }
marker_marked = { fg = "#00FF00", bold = true }
marker_selected = { fg = "#FFFF00", bold = true }
count_copied = { fg = "#00FF00", bold = true }
count_cut = { fg = "#FF0000", bold = true }
count_selected = { fg = "#FFFF00", bold = true }
border_symbol = "│"
border_style = { fg = "#5D6480" }

[indicator]
current = { fg = "#ff2a6d", bold = true }
parent = { fg = "#97A0BC" }
preview = {}
padding = { open = "", close = "" }

[tabs]
active = { fg = "#00BFC7", bold = true }
inactive = { fg = "#97A0BC" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[status]
overall = { bg = "reset" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#00FF00", bold = true }
progress_normal = { fg = "#0A84FF" }
progress_error = { fg = "#FF0000" }
perm_type = { fg = "#646B84" }
perm_read = { fg = "#FFFF00" }
perm_write = { fg = "#CD00F7" }
perm_exec = { fg = "#00FF00" }
perm_sep = { fg = "#4A5168" }

[mode]
normal_main = { fg = "#00BFC7", bold = true }
normal_alt = { fg = "#97A0BC" }
select_main = { fg = "#FFFF00", bold = true }
select_alt = { fg = "#97A0BC" }
unset_main = { fg = "#FF8C00", bold = true }
unset_alt = { fg = "#97A0BC" }

[pick]
border = { fg = "#5D6480" }
active = { fg = "#00BFC7", bold = true, underline = true }
inactive = {}

[input]
border = { fg = "#5D6480" }
title = { fg = "#00BFC7", bold = true }
value = { fg = "#FFF8DC" }
selected = { fg = "#00BFC7", bold = true, underline = true }

[confirm]
border = { fg = "#5D6480" }
title = { fg = "#00BFC7", bold = true }
body = { fg = "#D4D4D4" }
list = {}
btn_yes = { fg = "#00FF00", bold = true, underline = true }
btn_no = { fg = "#FF0000" }
btn_labels = [" [Y]es ", " (N)o "]

[cmp]
border = { fg = "#5D6480" }
active = { fg = "#00BFC7", bold = true, underline = true }
inactive = {}
icon_file = " "
icon_folder = " "
icon_command = " "

[tasks]
border = { fg = "#5D6480" }
title = { fg = "#00BFC7", bold = true }
hovered = { fg = "#00BFC7", underline = true }

[which]
border = { fg = "#5D6480" }
cols = 3
mask = { bg = "reset" }
cand = { fg = "#00BFC7" }
rest = { fg = "#97A0BC" }
desc = { fg = "#CD00F7" }
separator = "  "
separator_style = { fg = "#4A5168" }

[help]
border = { fg = "#5D6480" }
chord = { fg = "#00BFC7", bold = true }
action = { fg = "#CD00F7" }
hovered = { fg = "#00BFC7", bold = true, underline = true }

[notify]
title_info = { fg = "#00FF00" }
title_warn = { fg = "#FFFF00" }
title_error = { fg = "#FF0000" }
icon_info = " "
icon_warn = " "
icon_error = " "

[spot]
border = { fg = "#5D6480" }
title = { fg = "#00BFC7", bold = true }
tbl_cell = { reversed = true }
tbl_col = { bold = true, fg = "#00BFC7" }

