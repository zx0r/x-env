# ------------------------------------------------------------
# 1. Semantic Theming & Color Engine
# ------------------------------------------------------------

## Primary syntax highlighting theme mapped to Environment X design tokens.
## Resolves against ~/.config/bat/themes/x.tmTheme compiled in cache.
--theme="x"

## Force ANSI TrueColor & terminal styling across pipes and subshells
--color=always
--decorations=always
--italic-text=always

# ------------------------------------------------------------
# 2. Layout, Typography & Visual Structure
# ------------------------------------------------------------

## High-density structural components:
## - changes         : Git gutter status (+ added, ~ modified, - deleted)
## - grid            : Structural separation rules matching terminal aesthetics
## - header-filename : Normalized relative path header
## - header-filesize : Byte/KB weight inspector
## - numbers         : Synchronized gutter line numbers
## - snip            : Clean boundary markers across multi-range previews
--style="grid,header-filename,header-filesize,numbers,snip"

## Tab width normalized to 2 spaces (Enterprise indentation standard)
--tabs=2

## Wrapping behaviour: auto-wraps cleanly without line clobbering
--wrap=auto

## Squeeze consecutive empty lines to prevent vertical bloat
--squeeze-blank
--squeeze-limit=2

## Strip ANSI escape sequences automatically from colored inputs (e.g. diffs/logs)
--strip-ansi=auto

## Non-printable character notation (Unicode control representations: ␇, ␊, ␀)
--nonprintable-notation=unicode

## Binary content safety guardrail: do not vomit raw binary into terminal
--binary=no-printing

## Synchronize terminal / tmux pane title with active inspection target
--set-terminal-title

# ------------------------------------------------------------
# 3. Pager & Terminal Multiplexer Integration
# ------------------------------------------------------------

## Paging policy: automatic (invokes pager only when output exceeds screen height)
--paging=auto

## High-performance less configuration:
## --RAW-CONTROL-CHARS     : Preserves 24-bit TrueColor escape sequences
## --quit-if-one-screen    : Immediate return to prompt if content fits buffer
## --mouse                 : Native mouse scrolling within tmux & kitty
--pager="less -R -F -K --mouse"

## Git diff context lines preserved around modifications
--diff-context=5

# -------------------------------------------------------------
# 4. Ignored Suffixes (Template, Backup & Transient Stripping)
# -------------------------------------------------------------

## Strip transient and auxiliary suffixes so bat detects the true underlying syntax
--ignored-suffix=".sample"
--ignored-suffix=".example"
--ignored-suffix=".template"
--ignored-suffix=".dist"
--ignored-suffix=".default"
--ignored-suffix=".bak"
--ignored-suffix=".orig"
--ignored-suffix=".tmp"
--ignored-suffix=".swp"
--ignored-suffix=".disabled"

# --------------------------------------------------------------
# 5. Zero-Overhead Semantic Syntax Mappings (Lead Scientist Workstation Profile)
# --------------------------------------------------------------
# Note: Standard languages (Rust, Go, Python, TOML, YAML, JSON, Makefile, INI)
# are resolved at O(1) via precompiled binary assets (~/.cache/bat/syntaxes.bin).
# Only custom overrides, collision guards, and scientific extensions are mapped here.

# === Accelerated Computing, GPU Kernels & Low-Level ===
--map-syntax="*.cu:C++"
--map-syntax="*.cuh:C++"
--map-syntax="*.hpp:C++"
--map-syntax="*.h:C++"

# === Scientific Computing, Numerics & Typesetting ===
--map-syntax="*.jl:Julia"
--map-syntax="*.typ:Typst"
--map-syntax="*.tex:LaTeX"
--map-syntax="*.ltx:LaTeX"
--map-syntax="*.bib:BibTeX"

# === Modern Web & Workflow Specifications ===
--map-syntax="*.ts:TypeScript"
--map-syntax="*.tsx:TypeScriptReact"
--map-syntax="Snakefile:Python"
--map-syntax="*.smk:Python"
--map-syntax="*.pyi:Python"

# === Collision Guard: Protect Rust from local cargo.sublime-syntax ===
--map-syntax="*.rs:Rust"

# === Local Workstation Custom Syntaxes (~/.config/bat/syntaxes/) ===
--map-syntax="*.env:DotENV"
--map-syntax="*.env.*:DotENV"
--map-syntax=".env*:DotENV"
--map-syntax="*.ron:RON"
--map-syntax="*.proto:Protocol Buffer"
--map-syntax="*.pbtxt:Protocol Buffer (TEXT)"
--map-syntax="*.textproto:Protocol Buffer (TEXT)"
--map-syntax="*.csv:Advanced CSV"
--map-syntax="*.tsv:Advanced CSV"
--map-syntax="*.gitlog:Git Log"
--map-syntax="*.man:Manpage"

# === Configuration, Dotfiles & Terminal Environments ===
--map-syntax="*.conf:INI"
--map-syntax="*.cfg:INI"
--map-syntax="*.cnf:INI"
--map-syntax="*.properties:Java Properties"
--map-syntax="*.xcconfig:INI"
--map-syntax="*tmux*.conf:Bourne Again Shell (bash)"
--map-syntax=".tmux.conf:Bourne Again Shell (bash)"
--map-syntax="tmux.conf:Bourne Again Shell (bash)"
--map-syntax="*.tmux:Bourne Again Shell (bash)"
--map-syntax=".editorconfig:INI"
--map-syntax=".npmrc:INI"
--map-syntax=".yarnrc:INI"
--map-syntax=".gitconfig*:Git Config"
--map-syntax=".gitmodules:Git Config"

# === Modern Web, Frameworks & Schemas ===
--map-syntax="*.astro:TypeScriptReact"
--map-syntax="*.prisma:GraphQL"
--map-syntax="*.json5:JSON"
--map-syntax=".prettierrc:JSON"
--map-syntax=".eslintrc:JSON"
--map-syntax=".stylelintrc:JSON"
--map-syntax=".swcrc:JSON"
--map-syntax=".babelrc:JSON"

# === Build Systems & Orchestration ===
--map-syntax="Justfile:Makefile"
--map-syntax="justfile:Makefile"
--map-syntax="Procfile:YAML"
--map-syntax="Containerfile:Dockerfile"
--map-syntax="Earthfile:Dockerfile"

# === Apple Platform & System Development ===
--map-syntax="*.plist:XML"
--map-syntax="*.strings:Java Properties"
--map-syntax="*.metal:C++"
--map-syntax="*.theme:XML"
--map-syntax="*.tmTheme:XML"

# === Systems & Daemons ===
--map-syntax="*.service:INI"
--map-syntax="*.timer:INI"
--map-syntax="*.socket:INI"
--map-syntax="*.target:INI"
--map-syntax="*.kdl:YAML"
--map-syntax="*.luau:Lua"
