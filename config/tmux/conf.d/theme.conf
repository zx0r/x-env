# NOTE:━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#   ██╗  ██╗    W O R K S T A T I O N
#   ╚██╗██╔╝
#    ╚███╔╝     SYSTEMS OVER SCRIPTS
#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ━━━ LAYER I: STATE & ROUTING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Base Theme Injection
# Dynamically loads the color scheme.
# If $X_THEME is not set in the OS environment, gracefully fallback to 'dark'.
source-file -qF "#{@tmux_dir}/theme/#{?env:X_THEME,#{env:X_THEME},dark}.tmux"

# ━━━ LAYER II: DATA LAYER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Binary Resolution (DEV STAGE)
# Reads as: "If XDG_BIN_HOME exists, use it; otherwise fallback to ~/.local/bin"
# set -gF @linex_bin "#{?env:XDG_BIN_HOME,#{env:XDG_BIN_HOME},$HOME/.local/bin}/linex"

# 2. Data Endpoints (Strict Dependency Injection)
# The -F (Format) flag forces tmux to instantly evaluate the @linex variable
# during config parsing, ensuring zero runtime overhead.

# TOP Bar pane-border-format
set -gF @mod_git "linex git" # "module git_branch,git_commit,git_status,git_metrics"

# Bottom Bar
set -gF @mod_hw  "linex cpu mem ssd uptime"

# ━━━ LAYER III: COMPONENT FACTORY ━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Primitives (Micro-Components)
set -g @date        "#[fg=#{@ui_fg_muted}]%m.%d.%y %H:%M"
set -g @pane        "#[default,bg=#{@ui_surface},fg=#{@ui_accent}] #[fg=#{@ui_fg_muted}]#P"
set -g @zoom        "#[default,bg=#{@ui_surface},fg=#{@ui_highlight}]#{?window_zoomed_flag, , }"
set -g @prefix      "#[bold]#{?client_prefix,#[fg=#{@ui_success}]󰘳 ,#[fg=#{@ui_accent_alt}]󰘳 }"
set -g @project     "#[noreverse,noitalics,nounderscore,bold,fg=#{@ui_fg_muted}] #[fg=#{@ui_fg_muted}]#{b:pane_current_path}"
set -g @chinese_num "#{?#{==:#I,0},一,#{?#{==:#I,1},二,#{?#{==:#I,2},三,#{?#{==:#I,3},四,#{?#{==:#I,4},五,#{?#{==:#I,5},六,#{?#{==:#I,6},七,#{?#{==:#I,7},八,#{?#{==:#I,8},九,#I}}}}}}}}}"

set -g @mod_left    "#[noreverse,noitalics,nounderscore,bold,bg=#{@ui_surface},fg=#{@ui_border_1}] #[bold,fg=#{@ui_accent}]#S #{E:@project}"
set -g @mod_right   "#(#{E:@mod_hw}) #{E:@zoom}"

# ━━━ LAYER IV: RENDER ENGINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Terminal Title
set -g set-titles                     on
set -g set-titles-string              "#S:#I:#W - \"#T\""
set -gF cursor-colour                 "#{@ui_selection}"
set -gF prompt-cursor-colour          "#{@ui_selection}"
set -gF display-panes-colour          "#{@ui_fg_muted}"
set -gF display-panes-active-colour   "#{@ui_accent}"

# 2. Status Line
set -g status on
set -g status-justify                 absolute-centre
set -g status-interval                10
set -g status-position                bottom
set -g status-left                    "#{E:@mod_left}"
set -g status-right                   "#{E:@mod_right}"
set -g status-left-style              ""
set -g status-right-style             ""
set -g status-left-length             100
set -g status-right-length            200
set -g status-style                   "fg=#{@ui_fg_muted},bg=#{@ui_surface},bold,nounderscore,noitalics,noreverse"

# 3. Menus & Prompts
set -g menu-style                     "bg=#{@ui_bg},fg=#{@ui_fg}"
set -g message-style                  "bold,bg=#{@ui_bg},fg=#{@ui_success}"
set -g message-command-style          "bold,fg=#{@ui_success},bg=#{@ui_bg}"
set -g menu-border-style              "fg=#{@ui_success}"
set -g menu-selected-style            "bg=#{@ui_selection},fg=#{@ui_black}"

# 4. Copy Mode
set -gw mode-style                    "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-match-style         "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-mark-style          "bg=#{@ui_selection},fg=#{@ui_black},underscore"
set -gw copy-mode-position-format     "#{line_count} lines"
set -gw copy-mode-position-style      "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-selection-style     "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-current-match-style "bg=#{@ui_selection},fg=#{@ui_black},underscore"

# 5. Window Status
set -gw window-style                  "bg=default,fg=default"
set -gw window-active-style           "bg=default,fg=default"
#set -gw window-style                  "bg=default,fg=#{@ui_graphite}"
#set -gw window-active-style           "bg=default,fg=#{@ui_fg_muted}"
set -gw window-status-separator       ""

set -gw window-status-format         "#[bold,fg=#{@ui_fg_muted},bg=#{@ui_surface}]#{E:@chinese_num} "
set -gw window-status-current-format "#[fg=#{@ui_accent},bg=#{@ui_surface},bold]#{E:@chinese_num} "
set -gw window-status-style          "bg=#{@ui_surface},bold,nounderscore,noitalics,noreverse"
set -gw window-status-current-style  "bg=#{@ui_surface},bold,nounderscore,noitalics,noreverse"
set -gw window-status-bell-style     "bg=#{@ui_error},fg=#{@ui_bg}"
set -gw window-status-activity-style "fg=#{@ui_warning},bg=#{@ui_surface},bold,nounderscore,noitalics,noreverse"
set -gw window-status-last-style     "bg=#{@ui_surface},fg=default"

# 6. Session & Popup
set -g popup-style                   "bg=default,fg=default"
set -g popup-border-style            "fg=#{@ui_accent}"
set -g popup-border-lines            single # rounded, single, double, heavy, simple

# 7. Display & Clock
set -gF clock-mode-style             24
set -gF clock-mode-colour            "#{@ui_accent_alt}"

# 8. Pane Borders
set -gw pane-scrollbars-style        "bg=#{@ui_bg},fg=#{@ui_success}"

# Options for pane-border-indicators: off | colour | arrows | both
set -gw pane-border-indicators       both

# Options for pane-border-lines: single | double | heavy | simple | number | spaces
set -g pane-border-lines             single
set -gw pane-border-status           top
set -gw pane-border-style            'fg=#{@ui_fg_subtle},bg=default'
set -gw pane-border-format           '#[align=left] #(#{E:@mod_git} "#{pane_current_path}")#{?pane_active,#[fg=#{@ui_accent}]●,#[fg=#{@ui_fg_muted}]○}#[align=right]#{?pane_active,#[fg=#{@ui_accent}]●,#[fg=#{@ui_fg_muted}]○}#{?#{&&:#{pane_active},#{client_prefix}},#[underscore],} #[fg=#{@ui_fg},bold]#{pane_current_command} #[fg=#{@ui_highlight},nobold] #[fg=#{@ui_fg_muted}]#{pane_tty} #[fg=#{@ui_highlight}]#{?window_zoomed_flag,⬢,❄} #[fg=#{@ui_fg_muted}]#P '
set -gw pane-active-border-style     '#{?pane_in_mode,fg=#{@ui_selection}#,bg=default,#{?synchronize-panes,fg=#{@ui_accent_alt}#,bg=default,#{?#{==:#{client_key_table},resize},fg=#{@ui_pink}#,bg=default,fg=#{@ui_accent}#,bg=default}}}'

