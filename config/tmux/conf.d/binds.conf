# ABSTRACTION HIERARCHY:
# ┌───────────────────────────────────────────────────────────────────────────────────┐
# │ TIER 0: CONTROL PLANE & HARNESS   (Prefix, Command Palette, Live Reload, Help)    │
# │ TIER 1: MACRO / WORKSPACE         (Sessions, Project Switching, tmx, Cmd+Tab UX) │
# │ TIER 2: MESO / CONTEXT            (Windows, Tabs, 1-9 Direct Jump, Worktrees)     │
# │ TIER 3: MICRO / SPATIAL GRID      (Panes, Splits, Zero-Fork Neovim Nav, Resizing) │
# │ TIER 4: Z-AXIS MODAL OVERLAYS     (Floating Popups: Lazygit, Yazi, Btop, AI, Sh)  │
# │ TIER 5: DATA BUS & TELEMETRY      (Buffers, OSC 52, Vi Copy-Mode, Diagnostics)    │
# └───────────────────────────────────────────────────────────────────────────────────┘

# ━━━ TIER 0: CONTROL PLANE & METAPLEXER ENGINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Unbind legacy default prefix
unbind-key -q -T prefix C-b

# 2. Prefix Passthrough (Readline & Shell beginning-of-line via double-tap C-a C-a)
bind-key -N "Send literal Prefix (C-a)" C-a send-prefix

# 3. Universal Command Palette (Categorized High-Density Interactive Modal)
bind-key -N "Universal Command Palette" C-p display-menu -x C -y C -b rounded \
  -T "#[bold,fg=#5ef1ff] 󱓞 COMMAND PALETTE #[default]" \
  "─── SPATIAL GRIDS & PANES ───" "" "" \
  "Split Horizontal (top/bottom)    [-]" - "split-window -v -c '#{pane_current_path}'" \
  "Split Vertical (left/right)      [|]" | "split-window -h -c '#{pane_current_path}'" \
  "Full-Height Split                [\\]" "\\" "split-window -fh -c '#{pane_current_path}'" \
  "Full-Width Split                 [_]" _ "split-window -fv -c '#{pane_current_path}'" \
  "Swap Pane Up                     [[]" "[" "swap-pane -U" \
  "Swap Pane Down                   []]" "]" "swap-pane -D" \
  "Balance Grid Layout              [=]" = "select-layout -E" \
  "#{?window_zoomed_flag,󰍉 Restore Pane,󰍉 Zoom Pane}               [z]" z "resize-pane -Z" \
  "Kill Active Pane                 [x]" x "kill-pane" \
  "" \
  "─── WINDOWS & CONTEXTS ───" "" "" \
  "New Window Next to Current       [c]" c "new-window -a -c '#{pane_current_path}'" \
  "New Window at End                [C]" C "new-window -c '#{pane_current_path}'" \
  "Rename Current Window            [,]" , "command-prompt -I '#W' -p 'Rename Window:' 'rename-window \"%%\"'" \
  "Break Pane to New Window         [!]" ! "break-pane" \
  "Kill Window                      [W]" W "confirm-before -p 'Kill window #W? (y/n)' kill-window" \
  "" \
  "─── WORKSPACES & SESSIONS ───" "" "" \
  "Workspace Switcher (tmx)     [Space]" Space "display-popup -xC -yC -b rounded -w 55% -h 65% -E -T '#[bold,fg=#bd5eff] 󱂬 Workspace Navigator #[default]' 'fish -c tmx'" \
  "Switch to Last Session         [Tab]" Tab "switch-client -l" \
  "Interactive Session Tree         [S]" S "choose-tree -Zs" \
  "New Named Session              [C-c]" C-c "command-prompt -p 'New Session Name:' 'new-session -A -s \"%%\"'" \
  "Rename Current Session           [R]" R "command-prompt -I '#S' -p 'Rename Session:' 'rename-session \"%%\"'" \
  "" \
  "Lazygit Repository Manager       [g]" g "display-popup -d '#{pane_current_path}' -xC -yC -w 92% -h 88% -b rounded -E -T '#[bold,fg=#5ef1ff] 󰊢 Lazygit #[default]' 'env XDG_CONFIG_HOME=$HOME/.config LG_CONFIG_DIR=$HOME/.config/lazygit lazygit'" \
  "Yazi Terminal File Manager       [y]" y "display-popup -d '#{pane_current_path}' -xC -yC -w 90% -h 85% -b rounded -E -T '#[bold,fg=#ffbd5e] 󰇥 Yazi #[default]' 'yazi'" \
  "Btop System Monitor              [b]" b "display-popup -xC -yC -w 88% -h 84% -b rounded -E -T '#[bold,fg=#5eff6c] 󰓅 System Monitor #[default]' 'btop'" \
  "AI Assistant Workspace           [a]" a "display-popup -d '#{pane_current_path}' -xC -yC -w 45% -h 80% -b rounded -E -T '#[bold,fg=#5ea1ff] 🤖 AI Workspace #[default]' 'fish -c \"tmx-ai --internal\"'" \
  "Persistent Scratchpad Shell      [']" "'" "if -F '#{==:#S,floating}' { detach } { set -gF '@last_session_name' '#S'; detach -s floating; popup -d '#{pane_current_path}' -xC -yC -w 82% -h 68% -b rounded -E -T '#[bold,fg=#7b8496]  Scratchpad Shell #[default]' 'tmux new -A -s floating \"tmux set -w pane-border-status off; TMUX_SESSION=floating $SHELL\"' }" \
  "" \
  "─── SYSTEM & CONTROL ───" "" "" \
  "Reload Configuration             [r]" r "source-file -qF '#{@tmux_dir}/tmux.conf' \\; display-message '󰑕 Configuration Reloaded'" \
  "Toggle Status Bar              [C-t]" C-t "if -F '#{==:#{status},on}' 'set status off' 'set status on'" \
  "Toggle Status Position (Top/Bot) [t]" t "if -F '#{==:#{status-position},top}' 'set -g status-position bottom; set -w pane-border-status top; set -gw pane-border-status top; display \"󰘳 Status: BOTTOM | Borders: TOP\"' 'set -g status-position top; set -w pane-border-status bottom; set -gw pane-border-status bottom; display \"󰘳 Status: TOP | Borders: BOTTOM\"'" \
  "Toggle Status Bar Clock          [T]" T "if -F '#{==:#{@clock_active},1}' { set -g @clock_active 0; set -g status-right '#{E:@module_right}' } { set -g @clock_active 1; set -g status-right '#{E:@module_right} #{E:@date}' }" \
  "Cycle Workspace Cyber Accent     [A]" A "if -F '#{==:#{@ui_accent},#{@ui_border_1}}' 'set -gF @ui_accent #{@ui_border_2}; display \"󰘳 Accent: MAGENTA\"' 'if -F \"#{==:#{@ui_accent},#{@ui_border_2}}\" \"set -gF @ui_accent #{@ui_border_3}; display \\\"󰘳 Accent: VIOLET\\\"\" \"set -gF @ui_accent #{@ui_border_1}; display \\\"󰘳 Accent: CYAN\\\"\"'" \
  "Toggle Pane Synchronization    [C-g]" C-g "if -F '#{pane_synchronized}' { set -w synchronize-panes off; display '󰒅 Pane Sync: OFF' } { set -w synchronize-panes on; display '󰒅 Pane Sync: ON' }" \
  "Toggle Mouse Capture             [m]" m "if -F '#{mouse}' { set -gq mouse off; display '󰍽 Mouse: OFF' } { set -gq mouse on; display '󰍽 Mouse: ON' }" \
  "Keybinding Cheat Sheet           [?]" ? "list-keys -N" \
  "Session Diagnostics & Telemetry  [i]" i "display-popup -xC -yC -w 60% -h 45% -b rounded -E -T '#[bold,fg=#ff5ef1] 󰅐 Session Telemetry #[default]' 'echo \"Session: #S\"; echo \"Windows: #{session_windows}\"; echo \"Panes:   #{window_panes}\"; echo \"Created: $(tmux display-message -p \"#{session_created}\" | xargs -I{} date -r {} \"+%Y-%m-%d %H:%M:%S\")\"; echo \"Attached Clients: #{session_attached}\"; echo; echo \"Press any key to close...\"; read -n 1 -s'" \
  "Kill Current Session             [X]" X "confirm-before -p '󰆴 Kill current session [#S]? [y/N]' kill-session" \
  "Kill Entire Tmux Server          [K]" K "confirm-before -p '󰆴 Kill entire TMUX server? [y/N]' kill-server"

# 4. Metaplexer Diagnostics & Lifecycle
bind-key -N "Reload Tmux configuration" r {
  source-file -qF "#{@tmux_dir}/tmux.conf"
  display-message "󰑕 [THE ENVIRONMENT X] Configuration Reloaded"
}

# Keybinding discovery and help
bind-key -N "Show keybinding catalog" ? list-keys -N
bind-key -N "Find keybinding by key"  M-/ command-prompt -kpkey { list-keys -1N '%%' }
bind-key -N "Describe keybinding (C-/)" User0 command-prompt -kpkey { list-keys -1N '%%' }

# Environmental toggles
bind-key -N "Toggle status bar visibility" C-t if -F '#{==:#{status},on}' 'set status off' 'set status on'
bind-key -N "Toggle status bar position (top/bottom)" t \
  if-shell -F '#{==:#{status-position},top}' {
    set -g status-position bottom
    set -g pane-border-status top
    set -u -w pane-border-status
    display-message "󰘳 Status: BOTTOM | Borders: TOP"
  } {
    set -g status-position top
    set -g pane-border-status bottom
    set -u -w pane-border-status
    display-message "󰘳 Status: TOP | Borders: BOTTOM"
  }
bind-key -N "Toggle status bar clock" T \
  if-shell -F '#{==:#{@clock_active},1}' {
    set -g @clock_active 0
    set -g status-right '#{E:@module_right}'
    display-message "󰅐 Status Clock: OFF"
  } {
    set -g @clock_active 1
    set -g status-right '#{E:@module_right} #{E:@date}'
    display-message "󰅐 Status Clock: ON"
  }
bind-key -N "Cycle active workspace accent (status bar & border)" a \
  if-shell -F '#{==:#{@ui_accent},#{@ui_border_1}}' {
    set -gF @ui_accent "#{@ui_border_2}"
    display-message "󰘳 Workspace Accent: [2/3] MAGENTA"
  } {
    if-shell -F '#{==:#{@ui_accent},#{@ui_border_2}}' {
      set -gF @ui_accent "#{@ui_border_3}"
      display-message "󰘳 Workspace Accent: [3/3] VIOLET"
    } {
      set -gF @ui_accent "#{@ui_border_1}"
      display-message "󰘳 Workspace Accent: [1/3] CYAN"
    }
  }
bind-key -N "Toggle mouse ON"              m   { set -gq mouse on ; display-message '󰍽 Mouse: ON' }
bind-key -N "Toggle mouse OFF"             M   { set -gq mouse off; display-message '󰍽 Mouse: OFF' }

bind-key -N "Toggle pane synchronization" C-g \
  if-shell -F '#{pane_synchronized}' {
    set -w synchronize-panes off
    display-message "󰒅 Synchronize Panes: OFF"
  } {
    set -w synchronize-panes on
    display-message "󰒅 Synchronize Panes: ON"
  }


# ━━━ TIER 1: MACRO PLANE — SESSIONS & WORKSPACES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Macro-level context switching between distinct projects, environments, and repos.
# Architectural Principle: SESSIONS & WORKSPACES ARE GATED BEHIND PREFIX (C-a).

# 1. Instant Session Toggle (Cmd+Tab UX Paradigm)
bind-key -N "Toggle last active session (Cmd+Tab UX)" Tab switch-client -l

# 2. Sequential Workspace & Session Cycling (Prefix + Arrows)
bind-key -r -N "Switch to previous session (Prefix Left)"  Left  switch-client -p
bind-key -r -N "Switch to next session (Prefix Right)"     Right switch-client -n

# 3. Floating Workspace Palettes (Fuzzy Project Discovery via tmx)
bind-key -N "Workspace Navigator (tmx)" s display-popup -xC -yC -b rounded -w 55% -h 65% -E \
  -T "#[bold,fg=#bd5eff] 󱂬 Workspace Navigator #[default]" "fish -c tmx"

bind-key -N "Interactive session tree view" S choose-tree -Zs

# 4. Session Lifecycle Management
bind-key -N "Create new session" C-c command-prompt -p " New Session Name:" "new-session -A -s '%%'"
bind-key -N "Rename current session" R command-prompt -I "#S" -p "󰑕 Rename Session:" "rename-session '%%'"
bind-key -N "Kill current session (confirmed)" X confirm-before -p "󰆴 Kill current session [#S]? [y/N]" kill-session
bind-key -N "Kill all OTHER sessions (confirmed)" Q confirm-before -p "󰆴 Kill all OTHER sessions? [y/N]" "kill-session -a"
bind-key -N "Kill entire tmux server (confirmed)" K confirm-before -p "󰆴 Kill entire TMUX server? [y/N]" kill-server
bind-key -n -N "Kill entire tmux server (confirmed)" M-q confirm-before -p "󰆴 Kill tmux server? [y/N]" kill-server
bind-key -n -N "Kill entire tmux server (confirmed)" M-Q confirm-before -p "󰆴 Kill tmux server? [y/N]" kill-server
bind-key -N "Detach current client" d detach-client


# ━━━ TIER 2: MESO PLANE — WINDOWS & CONTEXTS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Meso-level task channels, browser-like tabs, worktrees, and feature contexts.
# Architectural Principle: TABS (WINDOWS) USE SHIFT + ARROWS WITHOUT PREFIX.

# 1. Zero-Prefix Browser-Tab Navigation (High velocity linear cycling)
bind-key -n -N "Previous window (Shift+Left)" S-Left  previous-window
bind-key -n -N "Next window (Shift+Right)"     S-Right next-window

# 2. Random-Access Direct Indexing (0..9 Direct Jumps)
# Zero-prefix direct jumps (Alt + 0..9)
bind-key -n -N "Jump to window 0" M-0 select-window -t :=0
bind-key -n -N "Jump to window 1" M-1 select-window -t :=1
bind-key -n -N "Jump to window 2" M-2 select-window -t :=2
bind-key -n -N "Jump to window 3" M-3 select-window -t :=3
bind-key -n -N "Jump to window 4" M-4 select-window -t :=4
bind-key -n -N "Jump to window 5" M-5 select-window -t :=5
bind-key -n -N "Jump to window 6" M-6 select-window -t :=6
bind-key -n -N "Jump to window 7" M-7 select-window -t :=7
bind-key -n -N "Jump to window 8" M-8 select-window -t :=8
bind-key -n -N "Jump to window 9" M-9 select-window -t :=9

# Standard prefixed direct jumps
bind-key -N "Jump to window 0" 0 select-window -t :=0
bind-key -N "Jump to window 1" 1 select-window -t :=1
bind-key -N "Jump to window 2" 2 select-window -t :=2
bind-key -N "Jump to window 3" 3 select-window -t :=3
bind-key -N "Jump to window 4" 4 select-window -t :=4
bind-key -N "Jump to window 5" 5 select-window -t :=5
bind-key -N "Jump to window 6" 6 select-window -t :=6
bind-key -N "Jump to window 7" 7 select-window -t :=7
bind-key -N "Jump to window 8" 8 select-window -t :=8
bind-key -N "Jump to window 9" 9 select-window -t :=9

# 3. Context Toggles & Window History (Browser/IDE Tab UX inside Session)
bind-key -n -N "Toggle last active window (Global M-Tab)" M-Tab last-window

# 4. Window Creation (Zero-Prefix M-t)
bind-key -n -N "New window adjacent (Zero-Prefix M-t)" M-t new-window -a -c "#{pane_current_path}"

# 5. Window Reordering & Manipulation
bind-key -N "Move window left (keep focus)"  < { swap-window -d -t -1 }
bind-key -N "Move window right (keep focus)" > { swap-window -d -t +1 }

# 6. Window Lifecycle
bind-key -N "Rename current window" , command-prompt -I "#W" -p "󰑕 Rename Window:" "rename-window '%%'"
bind-key -N "Move window to another session" . command-prompt -p "󰪹 Move window to session:" "move-window -t '%%:'"
bind-key -N "Kill current window (confirmed)" W confirm-before -p "󰆴 Kill window [#W]? [y/N]" kill-window


# ━━━ TIER 3: MICRO PLANE — PANES & SPATIAL TOPOLOGY ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Micro-level spatial 2D Cartesian grid layout within the active window.
# Architectural Principle: 2D GRID PANES USE ALT + ARROWS (ZERO-FORK SPATIAL VECTOR).

# 1. Zero-Fork Smart Neovim / Tmux Navigation (Spatial Arrow Architecture)
# Eliminates shell fork penalties by using native regex format pattern matching.

# Spatial Arrow Vector (Alt + Left/Down/Up/Right)
bind-key -n -N "Smart pane left (Alt+Left)" M-Left \
  if-shell -F '#{m/ri:^n?vim?x?(diff)?$,#{pane_current_command}}' \
    { send-keys M-Left } \
    { if-shell -F '#{pane_at_left}' '' 'select-pane -L' }

bind-key -n -N "Smart pane down (Alt+Down)" M-Down \
  if-shell -F '#{m/ri:^n?vim?x?(diff)?$,#{pane_current_command}}' \
    { send-keys M-Down } \
    { if-shell -F '#{pane_at_bottom}' '' 'select-pane -D' }

bind-key -n -N "Smart pane up (Alt+Up)" M-Up \
  if-shell -F '#{m/ri:^n?vim?x?(diff)?$,#{pane_current_command}}' \
    { send-keys M-Up } \
    { if-shell -F '#{pane_at_top}' '' 'select-pane -U' }

bind-key -n -N "Smart pane right (Alt+Right)" M-Right \
  if-shell -F '#{m/ri:^n?vim?x?(diff)?$,#{pane_current_command}}' \
    { send-keys M-Right } \
    { if-shell -F '#{pane_at_right}' '' 'select-pane -R' }
# Symmetrical navigation inside Vi copy-mode (Arrows)
bind-key -T copy-mode-vi 'M-Left'  if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key -T copy-mode-vi 'M-Down'  if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'M-Up'    if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key -T copy-mode-vi 'M-Right' if-shell -F '#{pane_at_right}'  '' 'select-pane -R'

# Select previous/last pane
bind-key -N "Select last active pane" ';' last-pane

# 2. Geometric Splits (Path Preserving & Directory Inheriting)
# Prefixed mnemonic splits (Prevents collision with terminal ESC \ String Terminator)
bind-key -N "Split pane horizontally (top/bottom)" - split-window -v -c "#{pane_current_path}"
bind-key -N "Split pane vertically (left/right)"   | split-window -h -c "#{pane_current_path}"

# Full-span edge splits
bind-key -N "Split pane full height (left/right edge)" "\\" split-window -fh -c "#{pane_current_path}"
bind-key -N "Split pane full width (top/bottom edge)"   _  split-window -fv -c "#{pane_current_path}"

# 3. Spatial Reorganization & Topology Controls
# Instant Zero-Prefix Zoom Focus
bind-key -n -N "Toggle pane zoom (Zero-Prefix M-z)" M-z resize-pane -Z

# Physical Swap Panes (Prefixed brackets)
bind-key -r -N "Swap pane with previous pane" [ swap-pane -U
bind-key -r -N "Swap pane with next pane"     ] swap-pane -D

bind-key -N "Display pane index indicators" q display-panes
bind-key -N "Swap pane with target index"   Q display-panes { swap-pane -t '%%' }

# Break & join panes
bind-key -N "Break pane into new window (follow)"     B break-pane
bind-key -N "Break pane into new window (background)" '!' break-pane -d
bind-key -N "Break pane, send to left, background"   C-x break-pane -bd
bind-key -N "Join pane from window interactively"     @ command-prompt -p "󰪹 Join pane from [win.pane]:" "join-pane -s '%%'"

# Pane termination
bind-key -N "Kill active pane instantly" x kill-pane

# 4. Proportional Grid Resizing (Ctrl + Shift + Arrows ONLY)
bind-key -n -N "Resize pane left (Ctrl+Shift+Left)"   C-S-Left  resize-pane -L 5
bind-key -n -N "Resize pane down (Ctrl+Shift+Down)"   C-S-Down  resize-pane -D 3
bind-key -n -N "Resize pane up (Ctrl+Shift+Up)"       C-S-Up    resize-pane -U 3
bind-key -n -N "Resize pane right (Ctrl+Shift+Right)" C-S-Right resize-pane -R 5

# Layout management
bind-key -N "Balance all panes evenly"     = select-layout -E
bind-key -r -N "Rotate window layout"      M-r rotate-window
bind-key -N "Cycle to next layout"         N next-layout

# 5. Principal-Grade Floating FZF Pane Navigator (Zero-Overhead Modal)
# High-density fuzzy finder with live ANSI preview and spatial actions.
# M-f freed for shell readline forward-word; M-p assigned for zero-prefix popup.
bind-key -n -N "FZF Pane Navigator (Zero-Prefix M-p)" M-p display-popup -xC -yC -w 88% -h 80% -b rounded -E \
  -T "#[bold,fg=#5ef1ff] 󰈈 Pane Navigator #[default]" \
  "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} │ #{pane_current_command} │ #{b:pane_current_path} │ #{pane_title} │ #{pane_id}' | \
   fzf --reverse --header='Enter: Jump │ C-x: Kill │ C-v: V-Join │ C-s: H-Join │ C-t: Swap' \
       --delimiter='│' --with-nth=1..4 \
       --preview='tmux capture-pane -pe -t {5}' --preview-window='down:60%:border-top' \
       --bind='ctrl-x:execute-silent(tmux kill-pane -t {5})+reload(tmux list-panes -a -F \"#{session_name}:#{window_index}.#{pane_index} │ #{pane_current_command} │ #{b:pane_current_path} │ #{pane_title} │ #{pane_id}\")' \
       --bind='ctrl-v:execute(tmux join-pane -h -s {5})+accept' \
       --bind='ctrl-s:execute(tmux join-pane -v -s {5})+accept' \
       --bind='ctrl-t:execute(tmux swap-pane -s {5})+accept' \
   | awk -F'│' '{gsub(/ /, \"\", \$5); print \$5}' | xargs -I{} tmux switch-client -t {}"


# ━━━ TIER 4: Z-AXIS MODAL OVERLAYS — POPUPS & FLOATING ENCLAVES ━━━━━━━━━━━━━━━━━━━━━━
# Ephemeral floating tools that execute over the 2D layout without distorting geometry.

# 1. Lazygit Floating Git Hub (Zero-Prefix M-g / Alt+g)
bind-key -n -N "Open Lazygit modal (Global M-g)" M-g display-popup \
  -d "#{pane_current_path}" -xC -yC -w 92% -h 88% -b rounded -E \
  -T "#[bold,fg=#5ef1ff] 󰊢 Lazygit #[default]" "env XDG_CONFIG_HOME=$HOME/.config LG_CONFIG_DIR=$HOME/.config/lazygit lazygit"

# 2. Yazi Terminal File Manager (Zero-Prefix M-y)
bind-key -n -N "Open Yazi File Manager (Global M-y)" M-y display-popup \
  -d "#{pane_current_path}" -xC -yC -w 90% -h 85% -b rounded -E \
  -T "#[bold,fg=#ffbd5e] 󰇥 Yazi File Manager #[default]" "yazi"

# 3. Btop System & Process Monitor (Zero-Prefix M-b)
# Note: M-b overrides readline backward-word in favor of direct tool access.
bind-key -n -N "Open Btop System Monitor (Zero-Prefix M-b)" M-b display-popup \
  -xC -yC -w 88% -h 84% -b rounded -E \
  -T "#[bold,fg=#5eff6c] 󰓅 System & Process Monitor #[default]" "btop"

# 4. AI Workspace & Prompt Engine
bind-key -n -N "Open AI Workspace modal (Global M-a)" M-a display-popup \
  -d "#{pane_current_path}" -xC -yC -w 45% -h 80% -b rounded -E \
  -T "#[bold,fg=#5ea1ff] 🤖 AI Workspace #[default]" "fish -c 'tmx-ai --internal'"

# AI Prompt Editor in Neovim/fzf
bind-key -n -N "Edit AI prompt in Neovim (Global C-e)" C-e run-shell "#{@scripts}/ai/ai-prompt-edit.sh '#{pane_id}'"

# 5. Persistent Scratchpad Shell (Dedicated floating background session)
bind-key -n -N "Attach floating scratchpad shell (Global M-')" "M-'" \
  if-shell -F '#{==:#S,floating}' {
    detach-client
  } {
    set -gF '@last_session_name' '#S'
    detach-client -s floating
    popup -d '#{pane_current_path}' -xC -yC -w 82% -h 68% -b rounded -E \
      -T "#[bold,fg=#7b8496]  Scratchpad Shell #[default]" \
      'tmux new-session -A -s floating "tmux set -w pane-border-status off; TMUX_SESSION=floating $SHELL"'
  }

# 6. Interactive Cheatsheets (Zero-Prefix M-K and M-n)
bind-key -n -N "Tmux Architecture Hotkeys (Global M-K)" M-K display-popup \
  -xC -yC -w 86% -h 82% -b rounded -E \
  -T "#[bold,fg=#5ef1ff] 󰌌 TMUX HOTKEY MATRIX #[default]" \
  "#{@scripts}/cheatsheet.sh tmux"

bind-key -n -N "Neovim Command Matrix (Global M-n)" M-n display-popup \
  -xC -yC -w 86% -h 82% -b rounded -E \
  -T "#[bold,fg=#5eff6c]  NEOVIM COMMAND MATRIX #[default]" \
  "#{@scripts}/cheatsheet.sh nvim"


# ━━━ TIER 5: DATA BUS & VI BUFFER ENGINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# High-density text inspection, visual selection, search, clipboard bridges, and telemetry.

# 1. Vi Copy-Mode Initiation
bind-key -N "Enter Vi copy-mode (Enter)" Enter copy-mode
bind-key -N "Enter Vi copy-mode ([)"     [     copy-mode

# 2. Vi Visual Navigation & Selection (copy-mode-vi table)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Copy-pipe directly to system clipboard via pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Line boundary navigation
bind-key -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line

# Block / rectangle selection on Option (Alt) + Mouse drag
bind-key -T root M-MouseDrag1Pane \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
    send-keys -M
  } {
    copy-mode -M
    send-keys -X rectangle-toggle
  }
bind-key -T copy-mode-vi M-MouseDrag1Pane send-keys -X rectangle-toggle

# Vim-Asterisk search under cursor
bind-key -N "Search word forward under cursor" -T copy-mode-vi * \
  if-shell -F '#{selection_active}' {
    send-keys -X copy-pipe
    send-keys -FX search-forward-text '#{buffer_sample}'
  } {
    send-keys -FX search-forward '#{copy_cursor_word}'
  }

bind-key -N "Search word backward under cursor" -T copy-mode-vi "#" \
  if-shell -F '#{selection_active}' {
    send-keys -X copy-pipe
    send-keys -FX search-backward-text '#{buffer_sample}'
    send-keys -X search-again
  } {
    send-keys -FX search-backward '#{copy_cursor_word}'
  }

# Choice mode smooth paging
bind-key -T choice-mode C-d send-keys -X halfpage-down
bind-key -T choice-mode C-u send-keys -X halfpage-up

# 3. Clipboard & Paste Buffer Management
bind-key -N "Paste most recent buffer" p paste-buffer -p
bind-key -N "List all paste buffers"   P list-buffers
bind-key -N "Delete active buffer"     + { delete-buffer; display-message "󰆴 Buffer deleted" }

# System clipboard sync bridges
bind-key -N "Sync system clipboard into tmux buffer" M-, {
  run-shell "if command -v pbpaste >/dev/null 2>&1; then tmux set-buffer -- \"$(pbpaste)\"; elif command -v wl-paste >/dev/null 2>&1; then tmux set-buffer -- \"$(wl-paste)\"; elif command -v xsel >/dev/null 2>&1; then tmux set-buffer -- \"$(xsel -ob)\"; fi"
  display-message "󰅌 Synced from system clipboard"
}

bind-key -N "Sync tmux buffer to system clipboard" M-. {
  run-shell "if command -v pbcopy >/dev/null 2>&1; then tmux show-buffer | pbcopy; elif command -v wl-copy >/dev/null 2>&1; then tmux show-buffer | wl-copy; elif command -v xsel >/dev/null 2>&1; then tmux show-buffer | xsel -ib --trim; fi"
  display-message "󰅌 Synced to system clipboard"
}

# 4. Scrollback Capture Engine (Instant inspection in Neovim)
bind-key -N "Capture scrollback and open in Neovim" M-c run-shell \
  'FILE=/tmp/tmux-capture-$(date +%Y%m%d%H%M%S).txt; \
   tmux capture-pane -J -S -100000 -p > "$FILE"; \
   tmux new-window -n "scrollback" "nvim \"$FILE\""'

# 5. Enterprise Diagnostics & Telemetry
bind-key -N "Show session diagnostics & telemetry" i display-popup -xC -yC -w 60% -h 45% -b rounded -E \
  -T "#[bold,fg=#ff5ef1] 󰅐 Session Telemetry #[default]" \
  "echo '  󰆍 Session:  #S'; \
   echo '  󱂬 Windows:  #{session_windows}'; \
   echo '   Panes:    #{window_panes}'; \
   echo '  󰌢 Terminal: #{client_termname}'; \
   echo '  󰑕 Attached: #{session_attached} client(s)'; \
   echo '   Created:  $(tmux display-message -p \"#{session_created}\" | xargs -I{} date -r {} \"+%Y-%m-%d %H:%M:%S\")'; \
   echo; echo 'Press any key to close...'; read -n 1 -s"

bind-key -N "Show session audit log" C-a display-popup -xC -yC -w 80% -h 60% -b rounded -E \
  -T "#[bold,fg=#ffbd5e] 󰅐 Session Audit Log #[default]" \
  "tail -100 #{?env:XDG_STATE_HOME,#{env:XDG_STATE_HOME},#{env:HOME}/.local/state}/tmux/session-audit.log 2>/dev/null || echo 'No audit log found. Press Enter to exit...'; read"

