# ━━━ LAYER I: BOOTSTRAP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -gF @dir    "#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux"
set -gF @cfg    "#{@dir}/conf.d"

set -gu update-environment
set -ga update-environment "COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION SHELL EDITOR VISUAL GPG_TTY KITTY_PID KITTY_WINDOW_ID KITTY_LISTEN_ON NVIM_NOTTYFAST SNACKS_KITTY XDG_CONFIG_HOME LG_CONFIG_DIR"

# ━━━ LAYER II: MODULES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

source-file -qF "#{@cfg}/core.conf"
source-file -qF "#{@cfg}/binds.conf"
source-file -qF "#{@cfg}/hooks.conf"
source-file -qF "#{@cfg}/theme.conf"

