# NOTE:━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#   ██╗  ██╗    W O R K S T A T I O N
#   ╚██╗██╔╝
#    ╚███╔╝     SYSTEMS OVER SCRIPTS
#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ━━━ LAYER I: BOOTSTRAP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Abstract base path resolution with native XDG fallback.
set -gF @tmux_dir "#{?env:XDG_CONFIG_HOME,#{env:XDG_CONFIG_HOME},$HOME/.config}/tmux"

# 2. Strict dependency injection for internal routing (Zero-Overhead).
set -gF @config  "#{@tmux_dir}/config"
set -gF @scripts "#{?env:XDG_BIN_HOME,#{env:XDG_BIN_HOME}/tmux,$HOME/.local/bin/tmux}"

# ━━━ LAYER II: MODULE ROUTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

source-file -qF "#{@config}/core.conf"
source-file -qF "#{@config}/binds.conf"
source-file -qF "#{@config}/hooks.conf"
source-file -qF "#{@config}/theme.conf"
source-file -qF "#{@config}/plugins.conf"

# ━━━ LAYER III: ENV SYNC ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Context passthrough for seamless terminal-to-multiplexer integration.
set -ga update-environment "COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION SHELL EDITOR VISUAL GPG_TTY KITTY_PID KITTY_WINDOW_ID KITTY_LISTEN_ON NVIM_NOTTYFAST SNACKS_KITTY XDG_CONFIG_HOME LG_CONFIG_DIR"

# ━━━ LAYER IV: OPERATIONAL ROUTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Agentic AI Mode Router
# Zero-Fork UX pattern switcher.
# If $X_MODE is set (e.g., 'agent'), load Semantic PTY. Otherwise, load 'human'.
source-file -qF "#{@tmux_dir}/modes/#{?env:X_MODE,agent,human}.tmux"

# Deployment Tier State
# Zero-Fork deployment tier switcher (Danger zone colors).
# Reads $X_STAGE (dev, staging, prod). If not set, fallback to 'dev'.
source-file -qF "#{@tmux_dir}/stages/#{?env:X_STAGE,#{env:X_STAGE},dev}.tmux"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
