# ━━━ LAYER I: BOOTSTRAP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Abstract base path resolution with native XDG fallback.
set -gF @tmux_dir "#{?env:XDG_CONFIG_HOME,#{env:XDG_CONFIG_HOME},$HOME/.config}/tmux"

# 2. Strict dependency injection for internal routing (Zero-Overhead).
set -gF @config  "#{@tmux_dir}/config"
set -gF @scripts "#{@tmux_dir}/scripts"

# ━━━ LAYER II: MODULE ROUTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

source-file -qF "#{@config}/core.conf"
source-file -qF "#{@config}/binds.conf"
source-file -qF "#{@config}/hooks.conf"
source-file -qF "#{@config}/theme.conf"
source-file -qF "#{@config}/plugins.conf"

# ━━━ LAYER III: ENV SYNC ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Context passthrough for seamless terminal-to-multiplexer integration.
set -ga update-environment "COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION SHELL EDITOR VISUAL GPG_TTY KITTY_PID KITTY_WINDOW_ID KITTY_LISTEN_ON NVIM_NOTTYFAST"

# ━━━ LAYER IV: OPERATIONAL STAGE ROUTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Zero-Fork deployment tier switcher. Evaluated entirely in C-space.
# Reads $X_STAGE (dev, staging, prod). If not set, gracefully falls back to 'dev'.
source-file -qF "#{@tmux_dir}/stages/#{?env:X_STAGE,#{env:X_STAGE},dev}.tmux"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
