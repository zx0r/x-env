# show-hooks [-gpw]    [-t target-pane]
# set-hook   [-agpRuw] [-t target-pane] hook-name command
#   -a  → append to hook
#   -g  → add hook to global list
#   -p  → set pane hooks
#   -R  → run hook immediately
#   -t  → specify target session
#   -u  → unset a hook
#   -w  → set window hooks

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Auto hide pane-border-status line when only one pane is displayed
set-hook -g after-new-session  { if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' 'set -w pane-border-status off' 'set -u -w pane-border-status' }
set-hook -g after-new-window   { if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' 'set -w pane-border-status off' 'set -u -w pane-border-status' }

# set-hook -wg window-linked      { if -F '#{==:#{window_panes},1}' 'display "link one"' 'display "link two"' }
# set-hook -wg window-unlinked    { if -F '#{==:#{window_panes},1}' 'display "unlink one"' 'display "unlink two"' }

set-hook -g after-kill-pane    { if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' 'set -w pane-border-status off' 'set -u -w pane-border-status' }
set-hook -g pane-exited        { if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' 'set -w pane-border-status off' 'set -u -w pane-border-status' }

# Adjust pane border status after splitting a window
set-hook -g after-split-window { if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' 'set -w pane-border-status off' 'set -u -w pane-border-status' }

set-hook -g after-resize-pane {
  if -F '#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}' {
    set -w pane-border-status off
  } {
    set -u -w pane-border-status
  }
}

# Restore cursor shape after exiting copy mode
set-hook -g after-copy-mode 'set -g cursor-style blinking-underline'

# ━━━ Enterprise Session Health Monitoring ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Unified session initialization (audit log + respawn behavior)
set-hook -g session-created {
  run-shell "mkdir -p #{?env:XDG_STATE_HOME,#{env:XDG_STATE_HOME},#{env:HOME}/.local/state}/tmux && echo '[tmux] Session created: #S at $(date \"+%Y-%m-%d %H:%M:%S\")' >> #{?env:XDG_STATE_HOME,#{env:XDG_STATE_HOME},#{env:HOME}/.local/state}/tmux/session-audit.log 2>/dev/null"
}

# Log session closure for audit trail
set-hook -g session-closed {
  run-shell "mkdir -p #{?env:XDG_STATE_HOME,#{env:XDG_STATE_HOME},#{env:HOME}/.local/state}/tmux && echo '[tmux] Session closed: #S at $(date \"+%Y-%m-%d %H:%M:%S\")' >> #{?env:XDG_STATE_HOME,#{env:XDG_STATE_HOME},#{env:HOME}/.local/state}/tmux/session-audit.log 2>/dev/null"
}

# Warn about zombie panes (pane exited but not closed)
set-hook -g pane-died {
  display-message -d 5000 "⚠ Pane #P in window #I exited (PID: #{pane_pid}). Consider: respawn-pane -t #{pane_id}"
}

# ━━━ Native Event-Driven Border Sync (0 Overhead) ━━━━━━━━━━━━━━━━━━━━━━━━━
# Обновление только по системным событиям tmux (0 форков при наборе текста)
set-hook -g after-select-pane      { refresh-client -S }
set-hook -g after-select-window    { refresh-client -S }
set-hook -g client-focus-in        { refresh-client -S }
set-hook -g client-session-changed { refresh-client -S }

