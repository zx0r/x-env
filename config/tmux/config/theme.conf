# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#   ██╗  ██╗    T H E   E N V I R O N M E N T   X
#   ╚██╗██╔╝
#    ╚███╔╝     ▪ Backup Visual Engine & Sub-Router
#    ██╔██╗     ▪ Module: config/theme.conf
#   ██╔╝ ██╗    ▪ Architect: zx0r
#   ╚═╝  ╚═╝
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ━━━ LAYER I: STATE & ROUTING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Base Theme Injection
# Dynamically loads the color scheme.
# If $X_THEME is not set in the OS environment, gracefully fallback to 'dark'.
source-file -qF "#{@tmux_dir}/theme/#{?env:X_THEME,#{env:X_THEME},dark}.tmux"

# 2. Agentic AI Mode Router
# Zero-Fork UX pattern switcher.
# If $X_MODE is set (e.g., 'agent'), load Semantic PTY. Otherwise, load 'human'.
source-file -qF "#{@tmux_dir}/modes/#{?env:X_MODE,agent,human}.tmux"

# 3. Deployment Tier State
# Zero-Fork deployment tier switcher (Danger zone colors).
# Reads $X_STAGE (dev, staging, prod). If not set, fallback to 'dev'.
source-file -qF "#{@tmux_dir}/stages/#{?env:X_STAGE,#{env:X_STAGE},dev}.tmux"

# ━━━ LAYER II: DATA LAYER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Binary Resolution
# Reads as: "If XDG_BIN_HOME exists, use it; otherwise fallback to ~/.local/bin"
set -g @xtmux_bin "#{?env:XDG_BIN_HOME,#{env:XDG_BIN_HOME},~/.local/bin}/xtmux"

# 2. Data Endpoints (Strict Dependency Injection)
# The -F (Format) flag forces tmux to instantly evaluate the @tmuxship_bin variable
# during config parsing, ensuring zero runtime overhead.

# TOP Bar
set -gF @module_git      "#{@xtmux_bin} module git" # "module git_branch,git_commit,git_status,git_metrics"

# Bottom Bar
set -gF @module_hardware "#{@xtmux_bin} module hw"
set -gF @module_net      "#{@xtmux_bin} module net"
# set -gF @module_uptime   "#{@xtmux_bin} module uptime"

# ━━━ LAYER III: COMPONENT FACTORY ━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Primitives (Micro-Components)
set -g @date           "#[fg=#{@ui_fg_muted}]%m.%d.%y %H:%M"
set -g @pane           "#[default,bg=default,fg=#{@ui_accent}] #[fg=#{@ui_fg_muted}]#P"
set -g @zoom           "#[default,bg=default,fg=#{@ui_highlight}]#{?window_zoomed_flag, , }"
set -g @prefix         "#[bold]#{?client_prefix,#[fg=#{@ui_success}]󰘳 ,#[fg=#{@ui_accent_alt}]󰘳 }"
set -g @status_project "#[noreverse,noitalics,nounderscore,bold,fg=#{@ui_fg_muted}] #[fg=#{@ui_fg_muted}]#{b:pane_current_path}"
set -g @chinese_num    "#{?#{==:#I,0},一,#{?#{==:#I,1},二,#{?#{==:#I,2},三,#{?#{==:#I,3},四,#{?#{==:#I,4},五,#{?#{==:#I,5},六,#{?#{==:#I,6},七,#{?#{==:#I,7},八,#{?#{==:#I,8},九,#I}}}}}}}}}"

# 2. Composition (Macro-Components)
set -g @module_left    "#[noreverse,noitalics,nounderscore,bold,bg=default,fg=#{@ui_accent}]󰆍 #[bold,fg=#{@ui_lavender}]#S #{E:@status_project} "
set -g @module_right   "#(#{E:@module_net}) #{E:@prefix} #(#{E:@module_hardware}) #{E:@zoom} #{E:@date} "

# ━━━ LAYER IV: RENDER ENGINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. Terminal Title
set -g cursor-colour "#ff7700"
set -g prompt-cursor-colour "#ff7700"
set -g set-titles on
set -g set-titles-string "#S:#I:#W - \"#T\""

# 2. Status Line
set -g status on
set -g status-interval 10
set -g status-justify  absolute-centre
set -g status-position bottom
set -g status-style "fg=#{@ui_fg_muted},bg=default,bold,nounderscore,noitalics,noreverse"

set -g status-left         "#{E:@module_left}"
set -g status-left-length  100
set -g status-left-style   ""
set -g status-right        "#{E:@module_right}"
set -g status-right-length 200
set -g status-right-style  ""

# 3. Menus & Prompts
set -g menu-style          "bg=#{@ui_bg},fg=#{@ui_fg}"
set -g menu-selected-style "bg=white,fg=#{@ui_black}"
set -g menu-border-style   "fg=#{@ui_success}"
set -g message-style         "bold,bg=#{@ui_bg},fg=#{@ui_success}"
set -g message-command-style "bold,fg=#{@ui_success},bg=#{@ui_bg}"

# 4. Copy Mode
set -gw copy-mode-match-style         "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-mark-style          "bg=#{@ui_selection},fg=#{@ui_black},underscore"
set -gw copy-mode-current-match-style "bg=#{@ui_selection},fg=#{@ui_black},underscore"
set -gw copy-mode-position-format     "#{line_count} lines"
set -gw copy-mode-position-style      "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw copy-mode-selection-style     "bg=#{@ui_selection},fg=#{@ui_black}"
set -gw mode-style                    "bg=#{@ui_selection},fg=#{@ui_black}"

# 5. Window Status
set -gw window-status-separator ""
set -gw window-style       "bg=default,fg=default"
set -gw window-active-style "bg=default,fg=default"

set -gw window-status-format         "#[bold,fg=#{@ui_fg_muted},bg=default]#{E:@chinese_num} "
set -gw window-status-current-format "#[fg=#{@ui_accent},bg=default,bold]#{E:@chinese_num} "
set -gw window-status-style          "bg=default,bold,nounderscore,noitalics,noreverse"
set -gw window-status-current-style  "bg=default,bold,nounderscore,noitalics,noreverse"
set -gw window-status-bell-style     "bg=#{@ui_error},fg=#{@ui_bg}"
set -gw window-status-activity-style "fg=#{@ui_warning},bg=default,bold,nounderscore,noitalics,noreverse"
set -gw window-status-last-style     "bg=default,fg=default"

# 6. Pane Borders
set -gw pane-border-format '#[align=left] #(#{E:@module_git} "#{pane_current_path}" #{pane_active})#{?pane_active,#[fg=#{@ui_success}]●,#[fg=#{@ui_fg_muted}]○}#[align=right]#{?pane_active,#[fg=#{@ui_success}]●,#[fg=#{@ui_fg_muted}]○}#{?#{&&:#{pane_active},#{client_prefix}},#[underscore],} #[fg=#{@ui_fg},bold]#{pane_current_command} #[fg=#{@ui_highlight},nobold] #[fg=#{@ui_fg_muted}]#{pane_tty} #[fg=#{@ui_highlight}]#{?window_zoomed_flag,⬢,❄} #[fg=#{@ui_fg_muted}]#P '
# Options for pane-border-indicators: off | colour | arrows | both
set -gw pane-border-indicators both
# Options for pane-border-lines: single | double | heavy | simple | number | spaces
set -gw pane-border-lines    heavy
set -gw pane-border-status   top
set -gw pane-border-style    "fg=#{@ui_fg_muted},bg=default"
set -gw pane-active-border-style '#{?pane_in_mode,fg=#{@ui_selection}#,bg=default,#{?synchronize-panes,fg=#{@ui_accent_alt}#,bg=default,#{?#{==:#{client_key_table},resize},fg=#{@ui_pink}#,bg=default,fg=#{@ui_success}#,bg=default}}}'
set -gw pane-scrollbars-style "bg=#{@ui_bg},fg=#{@ui_success}"

# Default colour palette (array) – index 0‑255, each entry a colour
# set -gp pane-colours "black"

# 7. Session & Popup
set -gw session-status-style         "bg=default,fg=default"
set -gw session-status-current-style "bg=default,fg=default,bold"
set -gw popup-style        "bg=default,fg=default"
set -gw popup-border-lines heavy

if -F '#{m/r:3\.[4-9]$,#{version}}' {
    set -g popup-border-lines rounded
    set -g popup-border-style 'fg=#{@ui_overlay}'
}

# 8. Display & Clock
set -g display-panes-active-colour '#88507D'
set -g display-panes-colour        '#88507D'
set -g clock-mode-colour           '#f2594b'
set -gw clock-mode-style           24
