"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "cyberpunk_neon"
format = "$os$sudo$direnv$directory$git_branch$git_commit$git_status$git_metrics$fill$golang$lua$nodejs$python$rust$swift$terraform$docker_context$jobs$custom$cmd_duration$line_break$character"

[line_break]
format = "\n"

[fill]
disabled = false
symbol = ' '
style = 'fg:surface2'

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = "[❯](bold fg:red)"
vicmd_symbol = "[❮](bold fg:purple)"

[time]
disabled = true
format = '[ $time](bold fg:overlay2)'
time_format = '%T'

[cmd_duration]
disabled = true
show_milliseconds = false
min_time = 2000
format = "[󰔟 $duration ](bold fg:peach)"

[os]
disabled = true
format = "([$symbol]($style))"
style = "fg:green bg:base"

[sudo]
disabled = false
symbol = ' 󰿆 sudo'
format = "[$symbol]($style)"
style = "bold fg:crust bg:maroon"

[direnv]
disabled = false
format = "[$symbol$allowed]($style)"
style = "bold fg:sky"

[directory]
disabled = false
read_only = " 󰌾 "
home_symbol = "  ~"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ' '
format = " [$path]($style)[$read_only]($read_only_style) "
style = 'bold fg:overlay2 bg:base'
read_only_style = 'bold fg:surface2 bg:base'

[directory.substitutions]
"Music" = " "
"Repos" = " "
"Videos" = " "
"Pictures" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"obsidianVault" = "󰏪 "
".config" = " "

[hg_branch]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
disabled = true
symbol = ' '
truncation_length = 32
truncation_symbol = ''
style = 'bold fg:sapphire bg:base'
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
disabled = true
commit_hash_length = 7
only_detached = false
style = "bold fg:mauve bg:base"
format = "[\\($hash$tag\\)]($style) "

[git_status]
disabled = true
ignore_submodules = true
conflicted = "[✖${count}](bold fg:red) "
ahead = "[⇡${count}](bold fg:sapphire) "
behind = "[⇣${count}](bold fg:sapphire) "
diverged = "[⇕${count}](bold fg:mauve) "
untracked = "[?${count}](bold fg:sky) "
stashed = "[⚑${count}](bold fg:teal) "
modified = "[✚${count}](bold fg:peach) "
staged = "[●${count}](bold fg:green) "
renamed = "[»${count}](bold fg:blue) "
deleted = "[✘${count}](bold fg:red) "
format = "[$all_status$ahead_behind]($style)"
style = "bold fg:yellow"

[git_metrics]
disabled = true
ignore_submodules = true
added_style = 'bold fg:green bg:base'
deleted_style = 'bold fg:red bg:base'
format = "([▴$added]($added_style)[▾$deleted]($deleted_style)) "

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold fg:blue'
symbol = "  "
disabled = true

[buf]
symbol = " "
disabled = true

[c]
symbol = " "
disabled = true

[conda]
symbol = " "
disabled = false

[crystal]
symbol = " "
disabled = true

[dart]
symbol = " "
disabled = true

[docker_context]
disabled = false
format = "[🐳 $context]($style) "
style = "bold fg:blue bg:base"

[elixir]
symbol = " "
disabled = true

[elm]
symbol = " "
disabled = true

[fennel]
symbol = " "
disabled = true

[gcloud]
disabled = true
symbol = "☁️"
style = 'bold fg:overlay0 bg:base'
format = '[$symbol$account(\($project\))]($style) '

[golang]
symbol = " "
style = 'bold fg:peach'
format = '[$symbol($version)]($style)'
disabled = false

[guix_shell]
symbol = " "
disabled = true

[haskell]
symbol = " "
disabled = true

[haxe]
symbol = " "
disabled = true

[hostname]
ssh_symbol = " "
disabled = true

[java]
symbol = " "
disabled = true

[jobs]
disabled = true
symbol = "⚙ "
style = "bold fg:blue bg:base"
format = "[$symbol$number]($style) "

[julia]
symbol = " "
disabled = true

[kotlin]
symbol = " "
disabled = true

[lua]
symbol = " "
format = '[ ${symbol}(${version})]($style) '
style = 'bold fg:yellow'
disabled = false

[memory_usage]
symbol = "󰍛 "
disabled = false

[meson]
symbol = "󰔷 "
disabled = true

[nim]
symbol = "󰆥 "
disabled = true

[nix_shell]
symbol = " "
disabled = true

[nodejs]
symbol = " "
format = '[$symbol($version)]($style) '
style = 'bold fg:green'
disabled = false

[ocaml]
symbol = " "
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[package]
symbol = "📦 "
disabled = true

[perl]
symbol = " "
disabled = true

[php]
symbol = " "
disabled = true

[pijul_channel]
symbol = " "
disabled = true

[python]
pyenv_version_name = false
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version})]($style) '
style = 'bold fg:sky'
disabled = false

[rlang]
symbol = "󰟔 "
disabled = true

[ruby]
symbol = " "
disabled = true

[rust]
symbol = "🦀"
format = '[ ${symbol}(${version})]($style) '
style = 'bold fg:maroon'
disabled = false

[scala]
symbol = " "
disabled = true

[swift]
disabled = false
format = "[ $version]($style) "
style = "bold fg:peach bg:base"

[terraform]
disabled = false
format = "[󱁢 $workspace]($style) "
style = "bold fg:lavender bg:base"

[zig]
symbol = " "
disabled = true

[custom.ansible]
command = "ansible --version | awk 'NR==1{print $3}' | tr -d ']'"
when = "test -f ansible.cfg -o -f playbook.yml -o -d roles"
style = "bold fg:blue bg:base"
format = "[󱂚 $output]($style) "
shell = ["sh", "-c"]
disabled = false

[custom.venv]
disabled = false
command = "basename \"${VIRTUAL_ENV:-$CONDA_PREFIX}\""
when = "test -n \"$VIRTUAL_ENV\" -o -n \"$CONDA_PREFIX\""
format = "[  $output ]($style)"
style = "bold fg:crust bg:mauve"
shell = ["bash", "-c"]
use_stdin = false

[custom.neovim]
use_stdin = false
ignore_timeout = false
command = 'bob ls | awk "/Used/ {print \$2}"'
detect_folders = ["lua"]
style = "bold fg:flamingo"
format = "[ $output ]($style)"
shell = ["bash", "-c"]

[custom.xcode]
command = "xcodebuild -version | head -n1 | awk '{print $2}'"
when = "ls -1d *.xcodeproj *.xcworkspace 2>/dev/null | grep -q '.'"
style = "bold fg:sapphire bg:base"
format = "[🛠 $output]($style) "
shell = ["bash", "-c"]
disabled = false

[custom.docker_compose]
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
style = "bold fg:teal bg:base"
format = "[🐙]($style) "
disabled = false

[custom.fish_config]
command = "echo ''"
directories = ["~/.config/fish"]
when = "true"
style = "bold fg:teal bg:base"
format = "[󰈺]($style) "
disabled = false

