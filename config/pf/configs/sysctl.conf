# ==============================================================================
# macOS Security MIB Network Hardening Specification
# Platform: macOS Sequoia (Darwin 24+) / Apple Silicon
# Standards: NIST SP 800-219, CIS Apple macOS 15.0 Benchmark, RFC 6056, RFC 5927
# Target  : /Library/LaunchDaemons/local.macos-security.sysctl.plist
# ==============================================================================

# 1. L4 Stealth (CIS 3.1.2 & 3.1.3)
# Drop TCP packets directed to closed ports silently without sending TCP RST
net.inet.tcp.blackhole=2
# Drop UDP packets directed to closed ports silently without sending ICMP Port Unreachable
net.inet.udp.blackhole=1

# 2. ICMP Defense (CIS 3.1.1 & 3.1.4)
# Prevent host from participating in Smurf / broadcast ICMP amplification attacks
net.inet.icmp.bmcastecho=0
# Reject IPv4 ICMP routing redirect messages to prevent route poisoning and MITM
net.inet.ip.redirect=0
# Reject IPv6 ICMPv6 routing redirect messages (critical Wi-Fi MITM defense)
net.inet6.ip6.redirect=0
# Enforce strict in-kernel dropping of all inbound ICMP redirects
net.inet.icmp.drop_redirect=1

# 3. Port Scan & TCP Fingerprinting Defense
# Drop SYN+FIN scan packets used by nmap for OS fingerprinting
net.inet.tcp.drop_synfin=1

# 4. Ephemeral Port Randomization (RFC 6056)
# Randomize outgoing ephemeral TCP source ports to prevent blind TCP hijacking
net.inet.tcp.randomize_ports=1

# 5. Blind Reset Defense (RFC 5927)
# Prevent unauthenticated ICMP unreachable packets from resetting connections in SYN_SENT
net.inet.tcp.icmp_may_rst=0

# 6. Socket Hygiene & DarkWake Recovery
# Assume SO_KEEPALIVE on all connections to promptly clean dead sockets during roaming
net.inet.tcp.always_keepalive=1

# 7. Listen Queue Capacity (Workstation Scaling)
# Expand socket listen backlog from default 128 to 2048 to prevent burst ECONNREFUSED
kern.ipc.somaxconn=2048
