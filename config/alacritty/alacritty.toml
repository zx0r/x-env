#   ╚██╗██╔╝
#    ╚███╔╝     SYSTEMS OVER SCRIPTS
#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
#  Stack           : Fish + Tmux + Neovim
#  Display         : Liquid Retina XDR (Display P3) | 120Hz ProMotion
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── [ 01 ] GENERAL SETTINGS & IPC ──────────────────────────────────────
[general]
ipc_socket = true          # UNIX IPC socket for `alacritty msg`
live_config_reload = true  # Instant hot reload on file save
working_directory = "None" # Inherit parent process working directory

# ── [ 02 ] ENVIRONMENT ENGINE ──────────────────────────────────────────
[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
EDITOR = "nvim"
VISUAL = "nvim"
GIT_EDITOR = "nvim"
SUDO_EDITOR = "nvim"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
PYTHONIOENCODING = "UTF-8"

# ── [ 03 ] TERMINAL & CORE PROTOCOLS ──────────────────────────────────
[terminal]
osc52 = "OnlyCopy"
shell = { program = "/opt/homebrew/bin/fish", args = ["--login"] }

# ── [ 04 ] WINDOW ARCHITECTURE & GEOMETRY ─────────────────────────────
[window]
startup_mode = "Maximized"
dimensions = { columns = 140, lines = 38 }
position = "None"

padding = { x = 5, y = 5 }
dynamic_padding = true
resize_increments = false

decorations = "None"
decorations_theme_variant = "None"
opacity = 0.55
blur = true

# Critical macOS Setting: Left Option acts as Alt/Meta for word jumps & Vim
option_as_alt = "OnlyLeft"
level = "Normal"
class = { instance = "Alacritty", general = "Alacritty" }

title = "Alacritty"
dynamic_title = true

# ── [ 05 ] SCROLLBACK BUFFER & DYNAMICS ────────────────────────────────
[scrolling]
history = 20000
multiplier = 3

# ── [ 06 ] SELECTION & CLIPBOARD ENGINE ────────────────────────────────
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# ── [ 07 ] TYPOGRAPHY & FONT RENDERING ────────────────────────────────
[font]
size = 13.0
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 1 }
builtin_box_drawing = true

normal = { family = "Maple Mono NF", style = "Regular" }
bold = { family = "Maple Mono NF", style = "Bold" }
italic = { family = "Maple Mono NF", style = "Italic" }
bold_italic = { family = "Maple Mono NF", style = "Bold Italic" }

[cursor]
style = { shape = "Underline", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "On" }
blink_interval = 350
blink_timeout = 0
thickness = 0.15
unfocused_hollow = false

# ── [ 09 ] AUDIO & VISUAL SIGNALS ─────────────────────────────────────
[bell]
animation = "Ease"
duration = 200
color = "#ffffff"
command = "None"

# ── [ 10 ] MOUSE PROTOCOL & BEHAVIOR ──────────────────────────────────
[mouse]
hide_when_typing = false
bindings = [{ mouse = "Right", mods = "Control", action = "Paste" }]

# ── [ 11 ] HINTS SUITE (PARITY WITH KITTY HINTS) ──────────────────────
[hints]
alphabet = "jfkdls;ahgurieowpq"

# 1. URL & Hyperlinks -> open in browser (Cmd+Shift+U / Cmd+Click)
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
persist = false
command = "open"
binding = { key = "U", mods = "Command|Shift" }
mouse = { mods = "Command", enabled = true }

# 2. Copy URL -> Clipboard (Cmd+Shift+Y)
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
persist = false
action = "Copy"
binding = { key = "Y", mods = "Command|Shift" }

# 3. Git Hashes -> Clipboard (Cmd+Shift+H)
[[hints.enabled]]
regex = "\\b[0-9a-f]{7,40}\\b"
hyperlinks = false
post_processing = false
persist = false
action = "Copy"
binding = { key = "H", mods = "Command|Shift" }

# 4. File Paths with Line Numbers -> Neovim (Cmd+Shift+P)
[[hints.enabled]]
regex = "([\\w_./-]+):(\\d+)(?::(\\d+))?"
hyperlinks = false
post_processing = true
persist = false
command = { program = "nvim", args = [] }
binding = { key = "P", mods = "Command|Shift" }

# ── [ 12 ] COLOR PALETTE ENGINE (ENVIRONMENT X : DARK TIER) ───────────
[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#000000"
foreground = "#ffffff"
dim_foreground = "#646b84"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#00ffff"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#39ff14"

[colors.selection]
text = "#000000"
background = "#00ffff"

[colors.search.matches]
foreground = "#000000"
background = "#00ffff"

[colors.search.focused_match]
foreground = "#000000"
background = "#39ff14"

[colors.hints.start]
foreground = "#000000"
background = "#39ff14"

[colors.hints.end]
foreground = "#000000"
background = "#00ffff"

[colors.line_indicator]
foreground = "#00ffff"
background = "#1f2333"

[colors.footer_bar]
foreground = "#39ff14"
background = "#1f2333"

[colors.normal]
black = "#1f2333"
red = "#ff0000"
green = "#39ff14"
yellow = "#ffff00"
blue = "#0a84ff"
magenta = "#cd00f7"
cyan = "#00ffff"
white = "#ffffff"

[colors.bright]
black = "#646b84"
red = "#b80000"
green = "#39ff14"
yellow = "#b8b800"
blue = "#075db4"
magenta = "#a855f7"
cyan = "#00ffff"
white = "#ffffff"

[colors.dim]
black = "#0f0f0f"
red = "#712b2b"
green = "#5f6f3a"
yellow = "#a17e4d"
blue = "#456877"
magenta = "#704d68"
cyan = "#4d7770"
white = "#8e8e8e"

# ── [ 13 ] KEYBOARD MATRIX & BINDINGS ─────────────────────────────────
[keyboard]
bindings = [
  # macOS Native Clipboard & Paste Selection (alacritty.BAK & Kitty parity)
  { key = "V", mods = "Command", action = "Paste" },
  { key = "C", mods = "Command", action = "Copy" },
  { key = "Insert", mods = "Shift", action = "PasteSelection" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },

  # Screen & Log Diagnostics (alacritty.BAK parity)
  { key = "L", mods = "Control", action = "ClearLogNotice" },
  { key = "L", mods = "Control", chars = "\u000c" },
  { key = "K", mods = "Command", action = "ClearHistory" },

  # Scrollback Buffer Navigation (alacritty.BAK & Kitty parity)
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", action = "ScrollToTop" },
  { key = "End", mods = "Shift", action = "ScrollToBottom" },

  # Typography & Font Scaling
  { key = "Plus", mods = "Command", action = "IncreaseFontSize" },
  { key = "Equals", mods = "Command", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Command", action = "DecreaseFontSize" },
  { key = "0", mods = "Command", action = "ResetFontSize" },

  # Window Lifecycle & macOS Frame Management (alacritty.BAK parity)
  { key = "N", mods = "Command", action = "CreateNewWindow" },
  { key = "Return", mods = "Command", action = "SpawnNewInstance" },
  { key = "Return", mods = "Command|Shift", action = "SpawnNewInstance" },
  { key = "Q", mods = "Command", action = "Quit" },
  { key = "W", mods = "Command", action = "Quit" },
  { key = "H", mods = "Command", action = "Hide" },
  { key = "H", mods = "Command|Alt", action = "HideOtherApplications" },
  { key = "M", mods = "Command", action = "Minimize" },
  { key = "F", mods = "Command|Control", action = "ToggleFullscreen" },
  { key = ".", mods = "Command", action = "ToggleSimpleFullscreen" },
  { key = ",", mods = "Command", action = "ToggleMaximized" },
  { key = "/", mods = "Command", action = "ToggleMaximized" },

  # macOS Native Tabs (alacritty.BAK + Kitty parity)
  { key = "T", mods = "Command", action = "CreateNewTab" },
  { key = "Right", mods = "Command", action = "SelectNextTab" },
  { key = "Left", mods = "Command", action = "SelectPreviousTab" },
  { key = "]", mods = "Command|Shift", action = "SelectNextTab" },
  { key = "[", mods = "Command|Shift", action = "SelectPreviousTab" },
  { key = "Tab", mods = "Control", action = "SelectNextTab" },
  { key = "Tab", mods = "Control|Shift", action = "SelectPreviousTab" },
  { key = "1", mods = "Command", action = "SelectTab1" },
  { key = "2", mods = "Command", action = "SelectTab2" },
  { key = "3", mods = "Command", action = "SelectTab3" },
  { key = "4", mods = "Command", action = "SelectTab4" },
  { key = "5", mods = "Command", action = "SelectTab5" },
  { key = "6", mods = "Command", action = "SelectTab6" },
  { key = "7", mods = "Command", action = "SelectTab7" },
  { key = "8", mods = "Command", action = "SelectTab8" },
  { key = "9", mods = "Command", action = "SelectLastTab" },

  # Vi Mode Engine (alacritty.BAK advanced selection suite + bug-free entry)
  { key = "F2", mods = "None", action = "ToggleViMode" },
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp", mode = "Vi" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown", mode = "Vi" },
  { key = "Escape", mods = "Alt", action = "ClearSelection", mode = "Vi" },
  { key = "I", mods = "Alt", action = "ScrollToBottom", mode = "Vi" },
  { key = "Y", mods = "Alt", action = "Copy", mode = "Vi" },
  { key = "V", mods = "Alt", action = "ToggleNormalSelection", mode = "Vi" },
  { key = "V", mods = "Shift", action = "ToggleLineSelection", mode = "Vi" },
  { key = "V", mods = "Control", action = "ToggleBlockSelection", mode = "Vi" },

  # Search Mode (alacritty.BAK + macOS standard)
  { key = "F", mods = "Command", action = "SearchForward", mode = "~Search" },
  { key = "B", mods = "Command", action = "SearchBackward", mode = "~Search" },
  { key = "F", mods = "Control|Shift", action = "SearchForward", mode = "~Search" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward", mode = "~Search" },

  # CSI u Extended Keyboard Protocol Disambiguation (Kitty parity)
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Return", mods = "Control", chars = "\u001b[13;5u" },
  { key = "Tab", mods = "Control", chars = "\u001b[9;5u" },
  { key = "Tab", mods = "Control|Shift", chars = "\u001b[9;6u" },

  # Shell Word Navigation & Text Editing (macOS ergonomic shortcuts)
  { key = "Left", mods = "Alt", chars = "\u001bb" },
  { key = "Right", mods = "Alt", chars = "\u001bf" },
  { key = "Back", mods = "Alt", chars = "\u0017" },
  { key = "Delete", mods = "Alt", chars = "\u001bd" },

  # Interactive Utilities Orchestration (Lazygit & Tmux workflow)
  { key = "G", mods = "Command|Alt", command = { program = "fish", args = [
    "-c",
    "lazygit",
  ] } },
  { key = "G", mods = "Command|Shift", command = { program = "fish", args = [
    "-c",
    "lazygit",
  ] } },
  { key = "T", mods = "Command|Alt", command = { program = "fish", args = [
    "-c",
    "tmx",
  ] } },
  { key = "T", mods = "Command|Shift", command = { program = "fish", args = [
    "-c",
    "tmx new",
  ] } },
]

# ── [ 14 ] TELEMETRY & HARDWARE DEBUG ─────────────────────────────────
[debug]
log_level = "Warn"
renderer = "None"
render_timer = false
print_events = false
highlight_damage = false
persistent_logging = false
prefer_egl = false
