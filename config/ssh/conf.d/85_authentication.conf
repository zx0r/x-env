# OpenSSH Client Configuration: Connection Protocol Domain (RFC 4254)
# Domain   : Channels, Session Multiplexing & Kernel Transport Governance
# Platform : macOS Sequoia (Apple Silicon arm64 Darwin 25+)
# Precedence: Global Defaults (Zone 80-84) — Evaluated after Host Overrides
# Path     : ~/.ssh/conf.d/80_connection.conf
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host *
    # Hardware Secure Enclave Identity Routing (Secretive Agent)
    # Dynamic symlink ~/.ssh/ssh_auth_sock maintained by 11-identity-agent.fish
    IdentityAgent ~/.ssh/ssh_auth_sock

    # Strict Identity Gating: Only present keys explicitly configured per host
    IdentitiesOnly yes
    AddKeysToAgent no
    UseKeychain yes

    # Authentication Constraints: Enforce Public Key Authentication Exclusively (RFC 4252)
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    HostbasedAuthentication no
    PubkeyAuthentication yes
