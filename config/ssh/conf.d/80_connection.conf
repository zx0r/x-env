# OpenSSH Client Configuration: Connection Protocol Domain (RFC 4254)
# Domain   : Channels, Session Multiplexing & Kernel Transport Governance
# Platform : macOS Sequoia (Apple Silicon arm64 Darwin 25+)
# Precedence: Global Defaults (Zone 80-84) — Evaluated after Host Overrides
# Path     : ~/.ssh/conf.d/80_connection.conf
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host *
    # Connection Multiplexing (Instantaneous subsequent SSH/Git/SFTP operations)
    ControlMaster auto
    ControlPersist 10m

    # CRITICAL DARWIN KERNEL DESIGN:
    # On macOS Darwin, struct sockaddr_un.sun_path is strictly limited to 104 bytes.
    # %C produces a deterministic 40-character SHA1 hash of (%l%h%p%r).
    # Path length: ~/.ssh/cm-%C = ~50 characters (100% immune to Darwin socket overflow).
    ControlPath ~/.ssh/cm-%C

    # Channel Inactivity & Multiplexing Garbage Collection (OpenSSH 9.2+ / 9.6+ Extension)
    # Granular space-separated idle timeouts for interactive sessions, local (-L), and reverse (-R) forwards
    ChannelTimeout session=15m direct-tcpip=30m forwarded-tcpip=30m

    # Connection Liveness & Network Resilience (RFC 4254 §2)
    ServerAliveInterval 15
    ServerAliveCountMax 3
    TCPKeepAlive yes
    ConnectionAttempts 3

    # Channel Lockdown, Anti-Leakage & Fail-Closed Forwarding (RFC 4254 §7.2)
    # Abort connection immediately if requested port forwarding cannot be established
    ExitOnForwardFailure yes
    ClearAllForwardings yes
    ForwardAgent no
    ForwardX11 no
    ForwardX11Trusted no
    PermitLocalCommand no
    Tunnel no

    # IP Quality of Service: Neutral Best-Effort baseline (RFC 2474 / RFC 8290)
    # Disables app-level DSCP tagging to avoid Wi-Fi AC_BK stalls, CAKE 1/16 caps,
    # and carrier EF-policer drops. Latency is managed natively by FQ-CoDel.
    IPQoS none
