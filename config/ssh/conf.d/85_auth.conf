# OpenSSH Client Configuration: Authentication Protocol Domain (RFC 4252)
# Domain   : User Authentication, Identity Routing & Credential Isolation
# Standards: RFC 4252 | RFC 8709 (Ed25519) | FIDO2 / Secure Enclave Hardware Isolation
# Platform : macOS Sequoia (Apple Silicon arm64 Darwin 25+)
# Precedence: Global Defaults (Zone 85-89) — Evaluated after Host Overrides
# Path     : ~/.ssh/conf.d/85_auth.conf
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host *
    # Hardware Secure Enclave Identity Routing (Secretive Agent)
    # Inherit SSH_AUTH_SOCK from environment (maintained by Fish IPC runtime & inbound SSH forwarding)
    IdentityAgent SSH_AUTH_SOCK

    # Strict Identity Gating: Only present keys explicitly configured per host
    IdentitiesOnly yes
    AddKeysToAgent no

    # Authentication Constraints: Enforce Public Key Authentication Exclusively (RFC 4252)
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    HostbasedAuthentication no
    PubkeyAuthentication yes
