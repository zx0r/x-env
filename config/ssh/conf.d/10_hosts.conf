# OpenSSH Target Scoping & Endpoint Overrides (readconf.c)
# Domain   : Target Scoping — Concrete Host Profiles, VCS & Infrastructure
# Platform : macOS Sequoia (Apple Silicon arm64 Darwin 25+)
# Hardware : Apple Secure Enclave (Secretive Touch ID Hardware Key)
# Precedence: First-Match-Wins (Zone 01-79) — Evaluated before global RFC protocols
# Path     : ~/.ssh/conf.d/10_hosts.conf
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. VERSION CONTROL SYSTEMS & DEVELOPER ENDPOINTS

# Standard GitHub Git Transport (Port 22)
Host github.com gist.github.com
    User git
    HostName github.com
    Port 22
    IdentityFile ~/.ssh/zx0r_ecdsa-sha2-nistp256@github.pub
    IdentitiesOnly yes
    AddKeysToAgent no
    UseKeychain yes
    PreferredAuthentications publickey
    # RFC 4255: Bypass SSHFP lookups on GitHub Anycast infrastructure (no DNSSEC SSHFP published)
    VerifyHostKeyDNS no
    # Optimize bulk Git I/O: Disable keystroke timing obfuscation (no interactive typing side-channel)
    ObscureKeystrokeTiming no

# GitHub Alternate SSH Transport (Port 443 - Firewall / Proxy Evasion)
# Essential for corporate networks, hotels, and restrictive firewalls blocking Port 22
Host ssh.github.com *.ssh.github.com 443.github.com *.443.github.com
    User git
    HostName ssh.github.com
    Port 443
    IdentityFile ~/.ssh/zx0r_ecdsa-sha2-nistp256@github.pub
    IdentitiesOnly yes
    PreferredAuthentications publickey
    VerifyHostKeyDNS no
    ObscureKeystrokeTiming no

# Alias: github-443 — Explicit Port 443 Git Remote
# Usage: git remote set-url origin github-443:username/repo.git
Host github-443
    User git
    HostName ssh.github.com
    Port 443
    IdentityFile ~/.ssh/zx0r_ecdsa-sha2-nistp256@github.pub
    IdentitiesOnly yes
    PreferredAuthentications publickey
    VerifyHostKeyDNS no
    ObscureKeystrokeTiming no

# 2. LOCAL INFRASTRUCTURE & NETWORK APPLIANCES

# Local Network Gateway / OpenWrt Router
Host openwrt openwrt.lan
    HostName openwrt.lan
    User root
    Port 22
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
