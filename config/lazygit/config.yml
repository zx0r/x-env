      "config.fish": {icon: "󰈺 "}
    extensions:
      ".ts": {icon: "󰛦 "}
      ".tsx": {icon: " "}
      ".js": {icon: " "}
      ".jsx": {icon: " "}
      ".json": {icon: " "}
      ".md": {icon: " "}
      ".mdx": {icon: " "}
      ".rs": {icon: " "}
      ".go": {icon: " "}
      ".lua": {icon: " "}
      ".fish": {icon: "󰈺 "}
      ".sh": {icon: " "}
      ".zsh": {icon: " "}
      ".bash": {icon: " "}
      ".yml": {icon: " "}
      ".yaml": {icon: " "}
      ".toml": {icon: " "}
      ".sql": {icon: "󰆼 "}
      ".graphql": {icon: "󰡯 "}

  # ----------------------------------------------------------------------------
  # Layout Geometry & Window Framing
  # ----------------------------------------------------------------------------
  scrollHeight: 2
  scrollPastBottom: true
  scrollOffMargin: 2
  scrollOffBehavior: margin
  tabWidth: 4
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false
  expandedSidePanelWeight: 2
  shrinkSidePanelsToContent: false
  mainPanelSplitMode: flexible
  enlargedSideViewLocation: left
  screenMode: normal
  portraitMode: auto
  portraitModeAutoMaxWidth: 84
  portraitModeAutoMinHeight: 46

  # Frame Styling & Borders
  border: rounded
  animateExplosion: true

  # Tree Hierarchy & Content Display
  showFileTree: true
  showRootItemInFileTree: true
  fileTreeSortOrder: mixed
  fileTreeSortCaseSensitive: true
  showNumstatInFilesView: true
  showListFooter: true
  showBottomLine: true
  showPanelJumps: true
  switchTabsWithPanelJumpKeys: true
  showCommandLog: true
  commandLogSize: 8
  filterMode: fuzzy

  # Commit & Branch Meta Visuals
  commitLength:
    show: true
  commitAuthorShortLength: 3
  commitAuthorLongLength: 18
  commitHashLength: 8
  showBranchCommitHash: true
  showDivergenceFromBaseBranch: arrowAndNumber
  commitGraphStyle: auto

  # Diff Staging & Hunk Rendering
  wrapLinesInDiffView: true
  useHunkModeInDiffView: true
  splitDiff: auto

  # Localization & Clock
  language: en
  timeFormat: 02 Jan 06
  shortTimeFormat: 3:04PM

  # Safety Dialog Bypasses
  mouseEvents: true
  skipAmendWarning: false
  skipDiscardChangeWarning: false
  skipStashWarning: true
  skipNoStagedFilesWarning: false
  skipRewordInEditorWarning: false
  skipSwitchWorktreeOnCheckoutWarning: false
  switchToFilesAfterStashPop: true
  switchToFilesAfterStashApply: true
  showRandomTip: false

  # ----------------------------------------------------------------------------
  # Cyberpunk High-Contrast Visible Borders & Neon Palette
  # ----------------------------------------------------------------------------
  theme:
    activeBorderColor:
      - "#00ffff" # Electric Neon Cyan — Focused Frame
      - bold
    inactiveBorderColor:
      - "#6272a4" # Visible Cyber Slate / Dracula Border — High Contrast
    searchingActiveBorderColor:
      - "#ff00ff" # Neon Magenta — Active Search Frame
      - bold
    optionsTextColor:
      - "#8be9fd" # Bright Cyan — Keybinding Help Text
    selectedLineBgColor:
      - "#3d59a1" # Deep Cyber Blue — Cursor Line
    selectedLineFgColor:
      - bold
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#00ffff" # Neon Cyan
    cherryPickedCommitBgColor:
      - "#3d59a1" # Deep Neon Blue
    markedBaseCommitFgColor:
      - "#00ffff"
    markedBaseCommitBgColor:
      - "#f1fa8c" # Neon Yellow
    unstagedChangesColor:
      - "#ff5555" # Laser Red
    defaultFgColor:
      - "#c0caf5" # Crisp Ice White
    authorColors:
      "x0r": "#00ffff"
      "zx0r": "#00ffff"
    branchColorPatterns:
      "main|master": "#50fa7b"     # Matrix Neon Green
      "feature/.*": "#ff79c6"      # Neon Pink / Magenta
      "fix/.*|hotfix/.*": "#ff5555"# Laser Red
      "release/.*": "#f1fa8c"     # Neon Yellow
      "refactor/.*": "#bd93f9"    # Electric Purple
      "chore/.*": "#6272a4"       # Cyber Slate

  spinner:
    frames: ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
    rate: 60

  statusPanelView: dashboard

# ------------------------------------------------------------------------------
# Git Engine & Differential Rendering Pipeline
# ------------------------------------------------------------------------------
git:
  diffRenderers:
    - name: "delta"
      colorArg: "always"
      command: "delta --dark --paging=never --line-numbers --hyperlinks --syntax-theme=Dracula --map-styles='bold purple => syntax \"#ff79c6\", bold cyan => syntax \"#00ffff\"'"
    - name: "difftastic"
      type: "extDiff"
      command: "difft --color=always"

  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72

  merging:
    manualCommit: false
    args: ""
    squashMergeMessage: "squash: merge {{selectedRef}} into {{currentBranch}}"

  mainBranches:
    - main
    - master

  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  autoDetectExternalChanges: true
  autoForwardBranches: onlyMainBranches
  fetchAll: true
  autoStageResolvedConflicts: true

  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
  allBranchesLogCmds:
    - "git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium"

  ignoreWhitespaceInDiffView: false
  diffContextSize: 3
  renameSimilarityThreshold: 50
  overrideGpg: false
  disableForcePushing: false
  commitPrefix: []
  commitPrefixes: {}
  branchPrefix: ""
  parseEmoji: true

  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false

  localBranchSortOrder: recency
  remoteBranchSortOrder: date
  truncateCopiedCommitHashesTo: 12

worktree:
  defaultPath: ""

# ------------------------------------------------------------------------------
# System State Transitions & Daemons
# ------------------------------------------------------------------------------
update:
  method: never # Homebrew-managed system binary
  days: 14

refresher:
  refreshInterval: 10
  fetchInterval: 60
  externalChangeCheckInterval: 2

confirmOnQuit: false
quitOnTopLevelReturn: true
disableStartupPopups: true
promptToReturnFromSubprocess: true

# ------------------------------------------------------------------------------
# Repository Detection Governor
# 'quit' = exits immediately without prompting or initializing empty folders
# 'prompt' = asks whether to init
# 'create' = initializes repo automatically
notARepository: quit

# ------------------------------------------------------------------------------
# OS Integration & Process Bridges (macOS Apple Silicon)
# ------------------------------------------------------------------------------
os:
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  editInTerminal: true
  openDirInEditor: "nvim {{dir}}"
  editPreset: ""
  open: "open {{filename}}"
  openLink: "open {{link}}"
  copyToClipboardCmd: "pbcopy < {{string}}"
  readFromClipboardCmd: "pbpaste"
  shellFunctionsFile: ""

# ------------------------------------------------------------------------------
# Enterprise Custom Commands Architecture
# ------------------------------------------------------------------------------
customCommands:
  # [Y]azi File Manager Integration
  - key: 'Y'
    command: 'yazi {{.SelectedFile.Name}}'
    context: 'files'
    description: 'Launch Yazi File Manager at cursor'
    loadingText: 'Opening Yazi...'
    output: terminal

  # Interactive Conventional Commits Assistant
  - key: '<c-a>'
    command: 'git commit -m "{{index .PromptResponses 0}}{{if index .PromptResponses 1}}({{index .PromptResponses 1}}){{end}}: {{index .PromptResponses 2}}"'
    context: 'files'
    description: 'Conventional Commit with Scope'
    prompts:
      - type: 'menu'
        title: 'Commit Type'
        options:
          - {name: 'feat:     ✨ A new feature', value: 'feat'}
          - {name: 'fix:      🐛 A bug fix', value: 'fix'}
          - {name: 'refactor: ♻️  Refactoring without behavior change', value: 'refactor'}
          - {name: 'perf:     ⚡ A code change that improves performance', value: 'perf'}
          - {name: 'style:    💄 Formatting, whitespace, style changes', value: 'style'}
          - {name: 'test:     🧪 Adding or updating tests', value: 'test'}
          - {name: 'docs:     📚 Documentation only changes', value: 'docs'}
          - {name: 'chore:    🔧 Tooling, build pipeline, dependencies', value: 'chore'}
          - {name: 'ci:       👷 CI/CD workflow changes', value: 'ci'}
      - type: 'input'
        title: 'Scope (optional, leave empty if none)'
      - type: 'input'
        title: 'Commit Description'

  # GitHub Pull Request Launcher
  - key: '<c-p>'
    command: 'gh pr create --web'
    context: 'localBranches'
    description: 'Create Pull Request on GitHub (Browser)'
    loadingText: 'Opening GitHub PR in browser...'

  # GitHub View Active PR
  - key: '<c-v>'
    command: 'gh pr view --web'
    context: 'localBranches'
    description: 'View current branch Pull Request on GitHub'
    loadingText: 'Opening Pull Request...'

  # Git Soft Reset (Undo Last Commit, Keep Changes Staged)
  - key: '<c-u>'
    command: 'git reset --soft HEAD~1'
    context: 'commits'
    description: 'Soft undo last commit (keep changes staged)'
    prompts:
      - type: 'confirm'
        title: 'Undo Commit'
        body: 'Soft reset HEAD~1? Commit will be deleted, changes remain staged.'

  # Force Wipe Untracked Files
  - key: '<c-x>'
    command: 'git clean -fd'
    context: 'files'
    description: 'Wipe all untracked files & directories (git clean -fd)'
    loadingText: 'Purging untracked artifacts...'
    prompts:
      - type: 'confirm'
        title: 'Purge Untracked'
        body: 'DANGER: Permanently delete all untracked files and directories?'

services: {}

