#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
# KITTY OPEN ACTIONS | ARCHITECT SPECIFICATION (macOS Native)
# Handlers for files, directories, protocols, and URLs.
# -----------------------------------------------------------------------------

# === [ 01 ] DIRECTORIES ======================================================
# Open directories in a new OS window with the same working directory.
protocol file
mime inode/directory
action launch --type=os-window --cwd $FILE_PATH

# === [ 02 ] TEXT FILES WITH LINE NUMBER FRAGMENTS ===========================
# Open compiler errors, ripgrep hyperlinks, or stack traces directly at target line
protocol file
fragment_matches [0-9]+
action launch --type=overlay ${EDITOR:-nvim} +${FRAGMENT} ${FILE_PATH}

# === [ 03 ] GENERIC TEXT FILES ===============================================
# Open text files in the editor in an overlay window.
protocol file
mime text/*
action launch --type=overlay ${EDITOR:-nvim} ${FILE_PATH}

# === [ 03 ] MEDIA & DOCUMENTS ================================================
# Open images and PDFs using macOS native viewer.
protocol file
mime image/*
action launch open $FILE_PATH

protocol file
mime application/pdf
action launch open $FILE_PATH

# === [ 04 ] SSH PROTOCOL =====================================================
# Establish SSH connection in a new Kitty OS window.
protocol ssh
action launch --type=os-window ssh $URL

# === [ 05 ] BINARIES & SCRIPTS ===============================================
# Run executable binaries and hold the window.
protocol file
mime application/x-executable
action launch --hold --type=os-window $FILE_PATH

# Run shell scripts (.sh, .fish, .bash, .zsh)
protocol file
ext sh,fish,bash,zsh
action launch --hold --type=os-window kitty +shebang $FILE_PATH __ext__

# Run custom scripts (.command, .tool)
protocol file
ext command,tool
action launch --hold --type=os-window kitty +shebang $FILE_PATH $SHELL

# === [ 06 ] WEB PROTOCOLS ====================================================
# Open HTTP/HTTPS URLs in macOS default browser.
protocol http
action launch open $URL

protocol https
action launch open $URL

# === [ 07 ] FALLBACK HANDLER =================================================
# Open any unhandled file with macOS native default handler.
protocol file
action launch open $FILE_PATH
