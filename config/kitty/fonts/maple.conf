# NOTE:-----------------------------------------------------------------------
#   ██╗  ██╗    W O R K S T A T I O N
#   ╚██╗██╔╝
#    ╚███╔╝     SYSTEMS OVER SCRIPTS
#    ██╔██╗     INTENT OVER DRIFT
#   ██╔╝ ██╗    AUTOMATION WITH CONTROL
#   ╚═╝  ╚═╝
# DOMAIN: HIGH-DENSITY MONOSPACED TYPOGRAPHY & FONT ENGINE
# Profile: Maple Mono NF (Modern Rounded Terminals + Cursive Calligraphy)
#
# ── [ INSTALLATION & HOMEBREW INSTRUCTIONS ] ─────────────────────────────────
# Patched Font via Homebrew:
#   brew install --cask font-maple-mono-nf
#
# Universal Glyph / Nerd Font Symbols Fallback:
#   brew install --cask font-symbols-only-nerd-font
#
# Activation:
#   switch_font maple  (or: include fonts/maple.conf in kitty.conf)
# -----------------------------------------------------------------------------

# Primary Typeface: Maple Mono NF
font_family                family='Maple Mono NF' style='Regular'
bold_font                  family='Maple Mono NF' style='Bold'
italic_font                family='Maple Mono NF' style='Italic'
bold_italic_font           family='Maple Mono NF' style='Bold Italic'
font_size                  13.0

# Text Shaping Optimization:
force_ltr                  yes
disable_ligatures          cursor

# OpenType Feature Injection (GSUB/GPOS: Disambiguation + Rigor Suite):
font_features              MapleMono-NF-Regular    +calt +zero +cv01 +cv04 +cv10 +cv09 +cv62 +ss07 +ss08
font_features              MapleMono-NF-Bold       +calt +zero +cv01 +cv04 +cv10 +cv09 +cv62 +ss07 +ss08
font_features              MapleMono-NF-Italic     +calt +zero +cv01 +cv04 +cv10 +cv09 +cv62 +ss07 +ss08
font_features              MapleMono-NF-BoldItalic +calt +zero +cv01 +cv04 +cv10 +cv09 +cv62 +ss07 +ss08

# Universal Glyph Routing (Nerd Fonts v3.2+):
symbol_map                 U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A2,U+E0A3,U+E0B0-U+E0B3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Scientific & Mathematical Fallback:
symbol_map                 U+2200-U+22FF,U+2A00-U+2AFF,U+27C0-U+27EF,U+2980-U+29FF,U+1D400-U+1D7FF STIX Two Math
symbol_map                 U+2300-U+23FF Apple Symbols
narrow_symbols             U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

# Retina Rasterization & GPU Micro-Metrics:
modify_font                baseline 0
modify_font                cell_width 100%
modify_font                cell_height 100%
modify_font                underline_position 1
modify_font                underline_thickness 150%
modify_font                strikethrough_position 2px

underline_exclusion        0
box_drawing_scale          0.001, 1, 1.5, 2
undercurl_style            thin-sparse

# ── [ RETINA RASTERIZATION & OPTICAL BLOOM ENGINE ] ──────────────────────────
# Coupling: Controls subpixel antialiasing and gamma bleed against dark backdrops.
#
# Rendering Profiles:
#   1. Crisp Mode (1:1 Vector Fidelity):
#      macos_thicken_font         0
#      text_composition_strategy  1.7 30    # Modern gamma-corrected alpha blending
#      text_fg_override_threshold 0
#
#   2. Neon Glow Mode (Optical Phosphor Aura):
#      macos_thicken_font         1.25      # Heavy stroke dilation for edge bloom
#      text_composition_strategy  legacy    # Legacy blending causes bright text bleed
#      text_fg_override_threshold 0
#
text_composition_strategy  legacy
macos_thicken_font         1.25
text_fg_override_threshold 0
